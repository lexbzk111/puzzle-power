<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle & Power</title>
    <!-- Подключаем официальный скрипт Telegram, чтобы WebApp работал на смартфонах -->
    <script src="https://telegram.org"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #ffffff;
            font-family: 'Georgia', serif;
        }
        /* Ставим твою светлую заставку на весь экран */
        .background {
            width: 100%; height: 100%;
            background: url('welcome_light.png') no-repeat center center;
            background-size: cover; position: relative;
        }
        /* Создаем невидимую кнопку поверх нарисованной серебряной плашки */
        .login-btn {
            position: absolute;
            bottom: 3.5%; left: 50%; /* Идеальные координаты под плашку на твоем арте */
            transform: translateX(-50%);
            width: 75%; height: 60px;
            cursor: pointer;
            background: transparent; /* Делаем саму кнопку прозрачной */
            border: none;
            outline: none;
            
            /* Стилизуем текст внутри рамки под цвет логотипа */
            color: #163654; 
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.1s;
        }
        /* Эффект легкого сжатия при тапе пальцем на телефоне */
        .login-btn:active {
            transform: translateX(-50%) scale(0.96);
        }
    </style>
</head>
<body>

    <div class="background">
        <!-- Надпись пишется кодом прямо внутри серебряной рамки вашей картинки -->
        <button class="login-btn" onclick="enterGame()">Начать играть</button>
    </div>
    <script>
        // Твоя постоянная безопасная ссылка ngrok до твоего ПК
        const SERVER_URL = 'https://shanty-haven-silo.ngrok-free.dev';

        // Безопасная инициализация Telegram WebApp без падения ошибок в браузере ПК
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        }

        function enterGame() {
            // Включаем тактильную вибрацию на смартфонах через Telegram SDK
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            
            // ID игрока по умолчанию для тестов на компьютере
            let tgId = 777;
            
            // Если открыли внутри реального Telegram — подтягиваем настоящий ID аккаунта
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgId = tg.initDataUnsafe.user.id;
            }

            console.log("Запрос авторизации для TG_ID:", tgId);

            // Отправляем пакет на твой локальный FastAPI сервер
            fetch(`${SERVER_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tg_id: tgId })
            })
            .then(response => response.json())
            .then(data => {
                               if (data.success) {
                    if (data.has_character) {
                        console.log("Персонаж найден в PostgreSQL! Добро пожаловать!");
                        // Перенаправляем игрока прямо на карту города
                        window.location.href = "lobby.html";
                    } else {
                        console.log("Персонажа нет. Отправляем на select.html...");
                        window.location.href = "select.html";
                    }
                } else {
                    alert("Ошибка авторизации на сервере.");
                }
            })
            .catch(err => {
                console.error("Сервер игры не отвечает через туннель:", err);
                // Форсированный пропуск на select.html для автономного тестирования дизайна экранов
                window.location.href = "select.html";
            });
        }
    </script>
</body>
</html>
