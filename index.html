    <script>
       // Твоя постоянная ссылка ngrok, которая ведёт прямо в базу PostgreSQL на твоём ПК!
const SERVER_URL = 'https://ngrok-free.dev';

// Безопасная инициализация Telegram WebApp без вылета ошибок на ПК
let tg = null;
if (window.Telegram && window.Telegram.WebApp) {
    tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Раскрываем игру на весь экран телефона
}

        function enterGame() {
            // Включаем сочную вибрацию телефона через Telegram SDK при нажатии
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            
            // 1. Вытягиваем реальный Telegram ID игрока. Если тестить на ПК в браузере — дадим дефолтный ID 777
            let tgId = 777;
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgId = tg.initDataUnsafe.user.id;
            }

            console.log("Отправляем запрос авторизации для TG_ID:", tgId);

            // 2. Делаем реальный fetch-запрос к твоему Python-серверу через туннель ngrok
            fetch(`${SERVER_URL}/api/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tg_id: tgId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (data.has_character) {
                        // ЕСЛИ ВОИН УЖЕ ЕСТЬ В БАЗЕ:
                        console.log("Персонаж найден в БД! Пускаем в лобби города...");
                        
                        // Здесь мы в будущем просто откроем интерфейс города, а пока выведем алерт:
                        alert(`Добро пожаловать обратно, ${data.user.name}! (Ур. ${data.user.level})`);
                        
                        // Куда перенаправлять старого игрока (например, на саму карту лобби, если сделаешь для неё отдельный файл):
                        // window.location.href = "lobby.html"; 
                    } else {
                        // ЕСЛИ ЭТО НОВЫЙ ИГРОК:
                        console.log("Воина в базе нет. Отправляем создавать персонажа...");
                        window.location.href = "select.html";
                    }
                } else {
                    alert("Ошибка авторизации на сервере игры.");
                }
            })
            .catch(err => {
                console.error("Сервер игры не отвечает:", err);
                alert("Не удалось подключиться к серверу. Убедись, что на ПК запущены server.py и ngrok!");
                
                // Временный пропуск для локальных тестов верстки (если сервер выключен, всё равно пустим дальше):
                window.location.href = "select.html";
            });
        }
    </script>
