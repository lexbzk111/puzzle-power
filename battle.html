<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бой - Puzzle & Power</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b1120; font-family: 'Segoe UI', sans-serif; color: #fff; }

        .battle-container { 
            position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 480px; 
            background: #0f172a; 
            display: flex; flex-direction: column; 
            overflow: hidden;
        }

        .header { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; height: 35px; }
        .exit-btn { font-size: 22px; color: #fff; cursor: pointer; background: none; border: none; }
        .title { flex-grow: 1; text-align: center; font-size: 16px; font-weight: 900; color: #fff; }

        /* Враг сверху (Компактно) */
        .enemy-area { display: flex; flex-direction: column; align-items: center; padding: 5px 15px; height: 100px; justify-content: center; }
        .enemy-img { width: 70px; height: 70px; object-fit: contain; transform: scaleX(-1); filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
        .enemy-hp-bar { width: 100%; height: 8px; background: rgba(0,0,0,0.7); border-radius: 6px; margin-top: 4px; overflow: hidden; border: 1px solid #334155; }
        .enemy-hp-fill { height: 100%; background: #ef4444; border-radius: 6px; transition: width 0.3s; }
        .enemy-info { display: flex; justify-content: space-between; width: 100%; margin-top: 2px; }
        .enemy-name { font-size: 12px; font-weight: 900; color: #facc15; }
        .enemy-level { font-size: 11px; color: #94a3b8; }

        /* ===== ОГРОМНОЕ ПОЛЕ 7x5 ===== */
        .board-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 0 10px; }
        .board { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            grid-template-rows: repeat(5, 1fr); 
            gap: 5px; 
            width: 100%; 
            max-width: 450px; 
            height: 100%; /* Растягиваем на всю высоту */
            max-height: 500px;
            background: rgba(0, 0, 0, 0.35);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .cell { position: relative; background: rgba(0,0,0,0.4); border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .cell.selected { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .cell img { width: 95%; height: 95%; object-fit: contain; }
        .cell.c-red img { filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.8)); }
        .cell.c-blue img { filter: drop-shadow(0 0 6px rgba(0, 150, 255, 0.8)); }
        .cell.c-green img { filter: drop-shadow(0 0 6px rgba(0, 255, 150, 0.8)); }
        .cell.c-yellow img { filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8)); }
        .cell.c-purple img { filter: drop-shadow(0 0 6px rgba(190, 0, 255, 0.8)); }

        /* Взрыв */
        .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); animation: explode 0.5s ease-out forwards; z-index: 10; }
        @keyframes explode { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); } }
        .explosion-flash { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: white; pointer-events: none; transform: translate(-50%, -50%); animation: flash 0.3s ease-out forwards; z-index: 9; }
        @keyframes flash { 0% { opacity: 0.8; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(2); } }

        /* ===== СКИЛЛЫ С ПОЛОСКАМИ МАНЫ (Как в E&P) ===== */
        .bottom-panel { padding: 5px 10px 10px; display: flex; flex-direction: column; gap: 5px; }
        .skill-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .skill-btn {
            height: 70px; border-radius: 8px; border: 1px solid #334155; cursor: pointer;
            display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 3px;
            background: rgba(30, 41, 59, 0.9); transition: 0.2s; position: relative; opacity: 0.4; pointer-events: none;
        }
        .skill-btn.active { opacity: 1; pointer-events: auto; border-color: #00d2ff; box-shadow: 0 0 10px rgba(0,210,255,0.3); }
        
        .skill-icon { font-size: 22px; }
        .skill-name { font-size: 8px; color: #94a3b8; margin-bottom: 2px; }
        .skill-cost { position: absolute; top: 3px; right: 4px; font-size: 8px; color: #00d2ff; font-weight: bold; }

        /* Индивидуальные полоски маны под скиллами */
        .skill-mana-bar { width: 90%; height: 5px; background: rgba(0,0,0,0.8); border-radius: 3px; overflow: hidden; }
        .skill-mana-fill { height: 100%; border-radius: 3px; width: 0%; transition: width 0.2s; }
        
        .mana-1 { background: #ef4444; } /* Красный */
        .mana-2 { background: #3b82f6; } /* Синий */
        .mana-3 { background: #22c55e; } /* Зеленый */
        .mana-4 { background: #facc15; } /* Желтый */
        .mana-5 { background: #a855f7; } /* Фиолетовый */

        /* Герой внизу */
        .player-area { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 5px; height: 50px; }
        .player-img { width: 45px; height: 45px; object-fit: contain; }
        .player-hp-bar { flex: 1; max-width: 250px; height: 10px; background: rgba(0,0,0,0.7); border-radius: 6px; overflow: hidden; border: 1px solid #334155; }
        .player-hp-fill { height: 100%; background: #22c55e; border-radius: 6px; transition: width 0.3s; }
        .player-info { width: 100px; display: flex; justify-content: space-between; }
        .player-name { font-size: 10px; color: #fff; font-weight: 900; }
        .player-level { font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="battle-container">
        <div class="header">
            <button class="exit-btn" onclick="window.location.href='lobby.html'">◀</button>
            <span class="title">Арена</span>
        </div>

        <div class="enemy-area">
            <img id="enemy-img" class="enemy-img" src="assets/character/mag.png" alt="Враг">
            <div class="enemy-hp-bar"><div id="enemy-hp" class="enemy-hp-fill" style="width: 100%;"></div></div>
            <div class="enemy-info">
                <span class="enemy-name" id="enemy-name">Бот</span>
                <span class="enemy-level" id="enemy-level">Ур. 1</span>
            </div>
        </div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <div class="bottom-panel">
            <div class="skill-row">
                <button class="skill-btn" id="skill1" onclick="useSkill(1)">
                    <span class="skill-icon">🔴</span><span class="skill-name">Удар</span><span class="skill-cost">30</span>
                    <div class="skill-mana-bar"><div id="mana-1" class="skill-mana-fill mana-1"></div></div>
                </button>
                <button class="skill-btn" id="skill2" onclick="useSkill(2)">
                    <span class="skill-icon">🔵</span><span class="skill-name">Лед</span><span class="skill-cost">40</span>
                    <div class="skill-mana-bar"><div id="mana-2" class="skill-mana-fill mana-2"></div></div>
                </button>
                <button class="skill-btn" id="skill3" onclick="useSkill(3)">
                    <span class="skill-icon">🟢</span><span class="skill-name">Щит</span><span class="skill-cost">50</span>
                    <div class="skill-mana-bar"><div id="mana-3" class="skill-mana-fill mana-3"></div></div>
                </button>
                <button class="skill-btn" id="skill4" onclick="useSkill(4)">
                    <span class="skill-icon">🟡</span><span class="skill-name">Ярость</span><span class="skill-cost">60</span>
                    <div class="skill-mana-bar"><div id="mana-4" class="skill-mana-fill mana-4"></div></div>
                </button>
                <button class="skill-btn" id="skill5" onclick="useSkill(5)">
                    <span class="skill-icon">🟣</span><span class="skill-name">Ульта</span><span class="skill-cost">100</span>
                    <div class="skill-mana-bar"><div id="mana-5" class="skill-mana-fill mana-5"></div></div>
                </button>
            </div>
            
            <div class="player-area">
                <img id="hero-img" class="player-img" src="assets/character/war.png" alt="Герой">
                <div class="player-hp-bar"><div id="hero-hp" class="player-hp-fill" style="width: 100%;"></div></div>
                <div class="player-info">
                    <span class="player-name" id="hero-name">Герой</span>
                    <span class="player-level" id="hero-level">Ур. 1</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const player = { name: localStorage.getItem('player_name') || 'Герой', level: 1, hp: 1000, maxHp: 1000, mana: 0, maxMana: 100, img: "assets/character/war.png" };
        const enemy = { name: "Гоблин-Маг", level: 1, hp: 800, maxHp: 800, img: "assets/character/mag.png" };

        const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
        const colorIcons = { red: 'assets/jewels/red.png', blue: 'assets/jewels/blue.png', green: 'assets/jewels/green.png', yellow: 'assets/jewels/yellow.png', purple: 'assets/jewels/purple.png' };

        let board = []; // 5 рядов x 7 колонок
        let selectedCell = null;
        let currentTurn = 'player';
        let enemyBlocked = false;

        // Стоимость скиллов
        const costs = [30, 40, 50, 60, 100];

        // Инициализация (7 колонок, 5 рядов)
        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board = [];
            for (let r = 0; r < 5; r++) {
                const row = [];
                for (let c = 0; c < 7; c++) {
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const cell = document.createElement('div');
                    cell.className = `cell c-${color}`;
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = () => handleCellClick(r, c);
                    boardEl.appendChild(cell);
                    row.push(color);
                }
                board.push(row);
            }
            renderBoard();
        }

        function createExplosion(r, c, color) {
            const boardEl = document.getElementById('board');
            const targetCell = boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            if (!targetCell) return;

            const colorsMap = { red: '255, 0, 0', blue: '0, 150, 255', green: '0, 255, 150', yellow: '255, 215, 0', purple: '190, 0, 255' };
            const rgb = colorsMap[color] || '255,255,255';

            const flash = document.createElement('div');
            flash.className = 'explosion-flash';
            flash.style.background = `rgba(${rgb}, 1)`;
            flash.style.left = '50%';
            flash.style.top = '50%';
            targetCell.appendChild(flash);
            setTimeout(() => flash.remove(), 400);

            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.background = `rgba(${rgb}, 0.9)`;
                const angle = (i / 6) * (2 * Math.PI);
                const distance = 10 + Math.random() * 15;
                particle.style.left = `calc(50% + ${Math.cos(angle) * distance}px)`;
                particle.style.top = `calc(50% + ${Math.sin(angle) * distance}px)`;
                targetCell.appendChild(particle);
                setTimeout(() => particle.remove(), 500);
            }
        }

        function handleCellClick(r, c) {
            if (currentTurn !== 'player') return;
            if (!selectedCell) {
                selectedCell = { r, c };
                document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`).classList.add('selected');
            } else {
                const dr = Math.abs(r - selectedCell.r);
                const dc = Math.abs(c - selectedCell.c);
                if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                    swapCells(selectedCell.r, selectedCell.c, r, c);
                } else {
                    document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
                    selectedCell = null;
                    handleCellClick(r, c);
                }
            }
        }

        function swapCells(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
            renderBoard();

            const matches = findMatches();
            if (matches.length > 0) {
                resolveMatches(matches);
            } else {
                const temp2 = board[r1][c1];
                board[r1][c1] = board[r2][c2];
                board[r2][c2] = temp2;
                renderBoard();
            }
            selectedCell = null;
            document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
        }

        function findMatches() {
            const matches = [];
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                        matches.push([r, c], [r, c+1], [r, c+2]);
                    }
                }
            }
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 7; c++) {
                    if (board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
                        matches.push([r, c], [r+1, c], [r+2, c]);
                    }
                }
            }
            return matches;
        }

        function resolveMatches(matches) {
            const unique = [...new Map(matches.map(m => [m.join(','), m])).values()];
            let manaGained = unique.length * 5;

            unique.forEach(([r, c]) => {
                createExplosion(r, c, board[r][c]);
                board[r][c] = null;
            });

            dropCrystals();
            renderBoard();
            addMana(manaGained);

            setTimeout(() => {
                const newMatches = findMatches();
                if (newMatches.length > 0) resolveMatches(newMatches);
                else endTurn();
            }, 300);
        }

        function dropCrystals() {
            for (let c = 0; c < 7; c++) {
                for (let r = 4; r >= 0; r--) {
                    if (board[r][c] === null) {
                        for (let r2 = r - 1; r2 >= 0; r2--) {
                            if (board[r2][c] !== null) {
                                board[r][c] = board[r2][c];
                                board[r2][c] = null;
                                break;
                            }
                        }
                    }
                }
                for (let r = 0; r < 5; r++) {
                    if (board[r][c] === null) board[r][c] = colors[Math.floor(Math.random() * colors.length)];
                }
            }
        }

        function renderBoard() {
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 7; c++) {
                    const color = board[r][c];
                    const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
                    cell.innerHTML = '';
                    cell.className = `cell c-${color}`;
                    const img = document.createElement('img');
                    img.src = colorIcons[color];
                    img.draggable = false;
                    cell.appendChild(img);
                }
            }
        }

        // Обновление маны (Индивидуальные полоски под скиллами)
        function addMana(amount) {
            player.mana = Math.min(player.maxMana, player.mana + amount);
            updateManaUI();
        }

        function updateManaUI() {
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`skill${i}`);
                const manaBar = document.getElementById(`mana-${i}`);
                
                // Заполняем полоску: сколько маны есть относительно стоимости скилла
                let fillPercent = (player.mana / costs[i-1]) * 100;
                if (fillPercent > 100) fillPercent = 100;
                manaBar.style.width = fillPercent + '%';

                // Активируем кнопку, если маны хватает
                if (player.mana >= costs[i-1]) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        }

        function useSkill(skillIndex) {
            if (currentTurn !== 'player') return;
            if (player.mana < costs[skillIndex - 1]) return;

            player.mana -= costs[skillIndex - 1];
            updateManaUI();

            const baseDamage = [150, 100, 0, 0, 300][skillIndex - 1];
            const crit = Math.random() < 0.2 ? 2 : 1;
            const damage = baseDamage * crit;

            if (damage > 0) {
                enemy.hp = Math.max(0, enemy.hp - damage);
                document.getElementById('enemy-hp').style.width = (enemy.hp / enemy.maxHp * 100) + '%';
                
                const enemyDiv = document.querySelector('.enemy-area');
                enemyDiv.style.transform = 'translateX(-10px)';
                setTimeout(() => enemyDiv.style.transform = '', 200);

                if (enemy.hp <= 0) {
                    setTimeout(() => alert('Победа!'), 300);
                    setTimeout(() => window.location.href = 'lobby.html', 600);
                    return;
                }
            }

            if (skillIndex === 2) {
                enemyBlocked = true;
                document.getElementById('enemy-name').innerText = '❄️ Заморожен';
            }

            currentTurn = 'enemy';
            setTimeout(enemyTurn, 800);
        }

        function enemyTurn() {
            if (enemyBlocked) {
                enemyBlocked = false;
                document.getElementById('enemy-name').innerText = 'Бот';
                currentTurn = 'player';
                return;
            }

            const damage = 80 + Math.random() * 40;
            player.hp = Math.max(0, player.hp - damage);
            document.getElementById('hero-hp').style.width = (player.hp / player.maxHp * 100) + '%';
            
            const playerDiv = document.querySelector('.player-area');
            playerDiv.style.transform = 'translateX(10px)';
            setTimeout(() => playerDiv.style.transform = '', 200);

            if (player.hp <= 0) {
                setTimeout(() => alert('Поражение...'), 300);
                setTimeout(() => window.location.href = 'lobby.html', 600);
                return;
            }

            currentTurn = 'player';
        }

        window.onload = function() {
            initBoard();
            document.getElementById('hero-name').innerText = player.name;
            document.getElementById('enemy-name').innerText = enemy.name;
            document.getElementById('enemy-level').innerText = 'Ур. 1';
            document.getElementById('hero-level').innerText = 'Ур. 1';
            
            const className = localStorage.getItem('class_name') || 'Warrior';
            const gender = localStorage.getItem('gender') || 'male';
            const classMap = { Warrior: 'war', Mage: 'mag', Tank: 'tank', Archer: 'luk' };
            const suffix = gender === 'male' ? '' : 'girl';
            player.img = `assets/character/${classMap[className]}${suffix}.png`;
            document.getElementById('hero-img').src = player.img;
            
            updateManaUI();
        };
    </script>
</body>
</html>
