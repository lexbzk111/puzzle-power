<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бой - Puzzle & Power</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b1120; font-family: 'Segoe UI', sans-serif; color: #fff; }

        .battle-container { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: linear-gradient(180deg, #0f172a 0%, #020617 100%); display: flex; flex-direction: column; }

        /* Шапка */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; }
        .exit-btn { font-size: 22px; color: #94a3b8; cursor: pointer; background: none; border: none; }
        .title { flex-grow: 1; text-align: center; font-size: 16px; font-weight: 900; color: #fff; }

        /* Экран героев */
        .heroes-area { display: flex; justify-content: space-between; padding: 0 15px; height: 150px; position: relative; }
        
        .hero-side { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 40%; }
        .hero-side.enemy { width: 40%; }
        
        .hero-img { width: 80px; height: 120px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
        .hero-hp-bar { width: 90%; height: 10px; background: #1e293b; border-radius: 6px; margin-top: 5px; overflow: hidden; border: 1px solid #334155; }
        .hero-hp-fill { height: 100%; background: #ef4444; border-radius: 6px; transition: width 0.3s; }
        
        .hero-name { font-size: 11px; font-weight: 900; margin-top: 5px; color: #facc15; }
        .hero-level { font-size: 10px; color: #94a3b8; }

        /* Враг */
        .hero-side.enemy { transform: scaleX(-1); } /* Отражаем врага зеркально */
        .hero-side.enemy .hero-img { transform: scaleX(-1); }

        /* Скиллы и мана */
        .skills-panel { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .mana-bar { width: 100%; height: 10px; background: #1e293b; border-radius: 6px; overflow: hidden; border: 1px solid #334155; position: relative; }
        .mana-fill { height: 100%; background: linear-gradient(90deg, #2563eb, #3b82f6); border-radius: 6px; transition: width 0.2s; }
        .mana-text { position: absolute; top: -2px; left: 0; width: 100%; text-align: center; font-size: 9px; font-weight: 900; color: #fff; text-shadow: 1px 1px 2px #000; }

        .skill-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .skill-btn {
            height: 52px; border-radius: 10px; border: 1px solid #334155; cursor: pointer;
            display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 2px;
            background: #1e293b; transition: 0.2s; position: relative; opacity: 0.3; pointer-events: none;
        }
        .skill-btn.active { opacity: 1; pointer-events: auto; border-color: #00d2ff; box-shadow: 0 0 10px rgba(0,210,255,0.3); }
        .skill-btn:hover { transform: translateY(-2px); }
        .skill-icon { font-size: 22px; }
        .skill-name { font-size: 7px; color: #94a3b8; }
        .skill-cost { position: absolute; top: 2px; right: 4px; font-size: 8px; color: #00d2ff; font-weight: bold; }

        /* Поле 7x7 */
        .board-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 0 10px 10px; }
        .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; width: 100%; max-width: 350px; aspect-ratio: 1; }
        .cell {
            background: rgba(0, 0, 0, 0.4); border-radius: 6px; border: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 26px;
            transition: transform 0.1s;
        }
        .cell.selected { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .cell.swapping { animation: bounce 0.2s; }
        @keyframes bounce { 0% { transform: scale(0.9); } 100% { transform: scale(1); } }

        /* Кристаллы */
        .c-red { color: #ef4444; text-shadow: 0 0 10px #ef4444; }
        .c-blue { color: #3b82f6; text-shadow: 0 0 10px #3b82f6; }
        .c-green { color: #22c55e; text-shadow: 0 0 10px #22c55e; }
        .c-yellow { color: #facc15; text-shadow: 0 0 10px #facc15; }
        .c-purple { color: #a855f7; text-shadow: 0 0 10px #a855f7; }
    </style>
</head>
<body>
    <div class="battle-container">
        <div class="header">
            <button class="exit-btn" onclick="window.location.href='lobby.html'">◀</button>
            <span class="title">Арена</span>
        </div>

        <!-- Герои -->
        <div class="heroes-area">
            <div class="hero-side player">
                <img id="hero-img" class="hero-img" src="assets/character/war.png" alt="Герой">
                <div class="hero-hp-bar"><div id="hero-hp" class="hero-hp-fill" style="width: 100%;"></div></div>
                <div class="hero-name" id="hero-name">Герой</div>
                <div class="hero-level" id="hero-level">Ур. 1</div>
            </div>
            
            <div class="hero-side enemy">
                <img id="enemy-img" class="hero-img" src="assets/character/mag.png" alt="Враг">
                <div class="hero-hp-bar"><div id="enemy-hp" class="hero-hp-fill" style="width: 100%;"></div></div>
                <div class="hero-name" id="enemy-name">Бот</div>
                <div class="hero-level" id="enemy-level">Ур. 1</div>
            </div>
        </div>

        <!-- Поле боя -->
        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <!-- Скиллы -->
        <div class="skills-panel">
            <div class="mana-bar">
                <div id="mana-fill" class="mana-fill" style="width: 0%;"></div>
                <div id="mana-text" class="mana-text">0 / 100</div>
            </div>
            <div class="skill-row">
                <button class="skill-btn" id="skill1" onclick="useSkill(1)">
                    <span class="skill-icon">🔴</span><span class="skill-name">Удар</span><span class="skill-cost">30</span>
                </button>
                <button class="skill-btn" id="skill2" onclick="useSkill(2)">
                    <span class="skill-icon">🔵</span><span class="skill-name">Лед</span><span class="skill-cost">40</span>
                </button>
                <button class="skill-btn" id="skill3" onclick="useSkill(3)">
                    <span class="skill-icon">🟢</span><span class="skill-name">Щит</span><span class="skill-cost">50</span>
                </button>
                <button class="skill-btn" id="skill4" onclick="useSkill(4)">
                    <span class="skill-icon">🟡</span><span class="skill-name">Ярость</span><span class="skill-cost">60</span>
                </button>
                <button class="skill-btn" id="skill5" onclick="useSkill(5)">
                    <span class="skill-icon">🟣</span><span class="skill-name">Ульта</span><span class="skill-cost">100</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. ДАННЫЕ ИГРОКА
        const player = {
            name: localStorage.getItem('player_name') || 'Герой',
            level: 1,
            hp: 1000,
            maxHp: 1000,
            mana: 0,
            maxMana: 100,
            img: "assets/character/war.png",
            critChance: 0.05,
        };

        // 2. ДАННЫЕ ВРАГА (Бот)
        const enemy = {
            name: "Гоблин-Маг",
            level: 1,
            hp: 800,
            maxHp: 800,
            img: "assets/character/mag.png",
        };

        // 3. ПРАВИЛА БОЯ
        const colors = ['red', 'blue', 'green', 'yellow', 'purple'];
        const colorIcons = {
            red: '🔴', blue: '🔵', green: '🟢', yellow: '🟡', purple: '🟣'
        };

        let board = []; // 7x7
        let selectedCell = null;
        let currentTurn = 'player'; // player или enemy
        let enemyBlocked = false; // Заморозка

        // 4. ИНИЦИАЛИЗАЦИЯ
        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board = [];
            for (let r = 0; r < 7; r++) {
                const row = [];
                for (let c = 0; c < 7; c++) {
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const cell = document.createElement('div');
                    cell.className = `cell c-${color}`;
                    cell.innerText = colorIcons[color];
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = () => handleCellClick(r, c);
                    boardEl.appendChild(cell);
                    row.push(color);
                }
                board.push(row);
            }
        }

        // 5. ЛОГИКА ВЫБОРА И СВАПА
        function handleCellClick(r, c) {
            if (currentTurn !== 'player') return;
            
            if (!selectedCell) {
                selectedCell = { r, c };
                document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`).classList.add('selected');
            } else {
                // Проверяем соседство
                const dr = Math.abs(r - selectedCell.r);
                const dc = Math.abs(c - selectedCell.c);
                if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                    // Свап
                    swapCells(selectedCell.r, selectedCell.c, r, c);
                } else {
                    // Сброс выбора
                    document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
                    selectedCell = null;
                    handleCellClick(r, c);
                }
            }
        }

        function swapCells(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
            renderBoard();

            // Проверяем, есть ли матчи
            const matches = findMatches();
            if (matches.length > 0) {
                resolveMatches(matches);
            } else {
                // Возвращаем обратно
                const temp2 = board[r1][c1];
                board[r1][c1] = board[r2][c2];
                board[r2][c2] = temp2;
                renderBoard();
            }
            selectedCell = null;
            document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
        }

        // 6. ПОИСК И УДАЛЕНИЕ МАТЧЕЙ
        function findMatches() {
            const matches = [];
            // Горизонтальные
            for (let r = 0; r < 7; r++) {
                for (let c = 0; c < 5; c++) {
                    if (board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                        matches.push([r, c], [r, c+1], [r, c+2]);
                    }
                }
            }
            // Вертикальные
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 7; c++) {
                    if (board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
                        matches.push([r, c], [r+1, c], [r+2, c]);
                    }
                }
            }
            return matches;
        }

        function resolveMatches(matches) {
            // Убираем дубликаты
            const unique = [...new Map(matches.map(m => [m.join(','), m])).values()];
            let manaGained = unique.length * 5; // Даем ману за каждый камень

            // Удаляем камни
            unique.forEach(([r, c]) => {
                board[r][c] = null;
            });

            // Падаем вниз
            dropCrystals();
            renderBoard();

            // Начисляем ману
            addMana(manaGained);

            // Проверяем каскады
            setTimeout(() => {
                const newMatches = findMatches();
                if (newMatches.length > 0) {
                    resolveMatches(newMatches);
                } else {
                    endTurn();
                }
            }, 300);
        }

        function dropCrystals() {
            for (let c = 0; c < 7; c++) {
                for (let r = 6; r >= 0; r--) {
                    if (board[r][c] === null) {
                        for (let r2 = r - 1; r2 >= 0; r2--) {
                            if (board[r2][c] !== null) {
                                board[r][c] = board[r2][c];
                                board[r2][c] = null;
                                break;
                            }
                        }
                    }
                }
                // Заполняем верх новыми
                for (let r = 0; r < 7; r++) {
                    if (board[r][c] === null) {
                        board[r][c] = colors[Math.floor(Math.random() * colors.length)];
                    }
                }
            }
        }

        // 7. ОТРИСОВКА ПОЛЯ
        function renderBoard() {
            const boardEl = document.getElementById('board');
            const cells = boardEl.children;
            for (let r = 0; r < 7; r++) {
                for (let c = 0; c < 7; c++) {
                    const idx = r * 7 + c;
                    const color = board[r][c];
                    cells[idx].className = `cell c-${color}`;
                    cells[idx].innerText = colorIcons[color];
                }
            }
        }

        // 8. МАНА И СКИЛЛЫ
        function addMana(amount) {
            player.mana = Math.min(player.maxMana, player.mana + amount);
            updateManaUI();
        }

        function updateManaUI() {
            document.getElementById('mana-fill').style.width = (player.mana / player.maxMana * 100) + '%';
            document.getElementById('mana-text').innerText = `${player.mana} / ${player.maxMana}`;
            
            // Активируем кнопки
            const costs = [30, 40, 50, 60, 100];
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`skill${i}`);
                if (player.mana >= costs[i-1]) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        }

        function useSkill(skillIndex) {
            if (currentTurn !== 'player') return;
            const costs = [30, 40, 50, 60, 100];
            if (player.mana < costs[skillIndex - 1]) return;

            player.mana -= costs[skillIndex - 1];
            updateManaUI();

            // Простая логика урона (потом заменим на формулы из статов)
            const baseDamage = [150, 100, 0, 0, 300][skillIndex - 1]; // Урон скиллов
            const crit = Math.random() < 0.2 ? 2 : 1; // 20% шанс крита
            const damage = baseDamage * crit;

            if (damage > 0) {
                enemy.hp = Math.max(0, enemy.hp - damage);
                document.getElementById('enemy-hp').style.width = (enemy.hp / enemy.maxHp * 100) + '%';
                
                // Анимация удара (тряска)
                const enemyDiv = document.querySelector('.hero-side.enemy');
                enemyDiv.style.transform = 'translateX(-10px)';
                setTimeout(() => enemyDiv.style.transform = '', 200);

                if (enemy.hp <= 0) {
                    setTimeout(() => alert('Победа!'), 300);
                    setTimeout(() => window.location.href = 'lobby.html', 600);
                    return;
                }
            }

            if (skillIndex === 2) {
                // Заморозка
                enemyBlocked = true;
                document.getElementById('enemy-name').innerText = '❄️ Заморожен';
            }

            // Передаем ход врагу
            currentTurn = 'enemy';
            setTimeout(enemyTurn, 800);
        }

        // 9. ХОД ВРАГА (Бот просто бьет)
        function enemyTurn() {
            if (enemyBlocked) {
                enemyBlocked = false;
                document.getElementById('enemy-name').innerText = 'Бот';
                currentTurn = 'player';
                return;
            }

            const damage = 80 + Math.random() * 40; // Случайный урон бота
            player.hp = Math.max(0, player.hp - damage);
            document.getElementById('hero-hp').style.width = (player.hp / player.maxHp * 100) + '%';
            
            const playerDiv = document.querySelector('.hero-side.player');
            playerDiv.style.transform = 'translateX(10px)';
            setTimeout(() => playerDiv.style.transform = '', 200);

            if (player.hp <= 0) {
                setTimeout(() => alert('Поражение...'), 300);
                setTimeout(() => window.location.href = 'lobby.html', 600);
                return;
            }

            currentTurn = 'player';
        }

        // 10. СТАРТ
        window.onload = function() {
            initBoard();
            document.getElementById('hero-name').innerText = player.name;
            document.getElementById('enemy-name').innerText = enemy.name;
            document.getElementById('enemy-level').innerText = 'Ур. 1';
            document.getElementById('hero-level').innerText = 'Ур. 1';
            
            // Подгружаем картинку героя из localStorage
            const className = localStorage.getItem('class_name') || 'Warrior';
            const gender = localStorage.getItem('gender') || 'male';
            const classMap = { Warrior: 'war', Mage: 'mag', Tank: 'tank', Archer: 'luk' };
            const suffix = gender === 'male' ? '' : 'girl';
            player.img = `assets/character/${classMap[className]}${suffix}.png`;
            document.getElementById('hero-img').src = player.img;
        };
    </script>
</body>
</html>
