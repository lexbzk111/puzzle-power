<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Герой - Puzzle & Power</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', sans-serif; color: #fff; }
        
        .hero-container {
            position: relative; width: 100%; max-width: 480px; height: 100dvh; height: 100vh; margin: 0 auto;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            display: flex; flex-direction: column;
        }

        /* Шапка */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 15px; }
        .back-btn { font-size: 24px; color: #00d2ff; cursor: pointer; background: none; border: none; }
        .title { font-size: 20px; font-weight: 900; color: #fff; }
        .stats-btn { font-size: 14px; background: #1e293b; border: 1px solid #00d2ff; color: #00d2ff; padding: 5px 10px; border-radius: 8px; cursor: pointer; }

        /* Кукла слева, слоты справа */
        .main-area { display: flex; height: 44%; padding: 0 10px; gap: 5px; }
        .doll-area { flex: 0 0 45%; display: flex; justify-content: center; align-items: center; }
        .doll-img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Слоты: Точное позиционирование по сетке (42px), зазор 4px */
        .slots-area { flex: 1; display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(4, 42px); justify-content: center; align-content: center; gap: 4px; }
        .slot {
            width: 42px; height: 42px;
            background: rgba(0,0,0,0.5); border: 1px solid #334155; border-radius: 5px;
            display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer;
        }
        .slot:hover { border-color: #00d2ff; }
        .slot img { width: 75%; height: 75%; object-fit: contain; }
        .slot-label { position: absolute; bottom: 0px; font-size: 5px; color: #94a3b8; }

        /* Позиции слотов */
        .slot-helmet { grid-column: 2; grid-row: 1; }
        
        .slot-ring1 { grid-column: 1; grid-row: 2; }
        .slot-amulet { grid-column: 2; grid-row: 2; }
        .slot-ring2 { grid-column: 3; grid-row: 2; }
        
        .slot-weapon { grid-column: 1; grid-row: 3; }
        .slot-armor { grid-column: 2; grid-row: 3; }
        .slot-shield { grid-column: 3; grid-row: 3; }
        
        .slot-gloves { grid-column: 1; grid-row: 4; }
        .slot-pants { grid-column: 2; grid-row: 4; }
        .slot-boots { grid-column: 3; grid-row: 4; }

        /* Итоговые эффекты */
        .bottom-area { flex: 1; padding: 0 15px 10px; display: flex; flex-direction: column; gap: 8px; }
        .derived-stats { background: #1e293b; border-radius: 10px; padding: 8px 10px; border: 1px solid #334155; }
        .ds-title { font-size: 11px; color: #00d2ff; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        .ds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .ds-row { display: flex; flex-direction: column; align-items: center; }
        .ds-name { color: #94a3b8; font-size: 9px; }
        .ds-val { color: #facc15; font-weight: 900; font-size: 14px; }

        /* ИНВЕНТАРЬ: 7 КОЛОНОК, 4 РЯДА. Фикс. размер 34px, зазор 4px (как у колец) */
        .inv-title { font-size: 11px; color: #00d2ff; text-transform: uppercase; font-weight: bold; margin-bottom: 3px; }
        .inv-grid { display: grid; grid-template-columns: repeat(7, 34px); grid-template-rows: repeat(4, 34px); gap: 4px; width: 100%; margin: 0 auto; justify-content: center; }
        .inv-slot { width: 34px; height: 34px; background: rgba(0,0,0,0.4); border: 1px solid #334155; border-radius: 4px; }
        .inv-slot img { width: 80%; height: 80%; object-fit: contain; }

        .inv-pagination { display: flex; justify-content: center; gap: 6px; margin-top: 3px; }
        .page-btn { background: #1e293b; border: 1px solid #334155; color: #fff; width: 22px; height: 22px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .page-btn.active { background: #00d2ff; color: #000; border-color: #00d2ff; }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='lobby.html'">◀</button>
            <span class="title">Герой</span>
            <button class="stats-btn" onclick="window.location.href='stats.html'">Статы</button>
        </div>

        <!-- Кукла слева + сетка слотов справа -->
        <div class="main-area">
            <div class="doll-area">
                <img class="doll-img" src="assets/char_male.png" alt="Герой">
            </div>
            <div class="slots-area">
                <!-- Ряд 1 -->
                <div></div>
                <div class="slot slot-helmet"><img src="assets/items/helmet.png" alt=""><span class="slot-label">Шлем</span></div>
                <div></div>

                <!-- Ряд 2 -->
                <div class="slot slot-ring1"><img src="assets/items/ring1.png" alt=""><span class="slot-label">Кольцо 1</span></div>
                <div class="slot slot-amulet"><img src="assets/items/amulet.png" alt=""><span class="slot-label">Амулет</span></div>
                <div class="slot slot-ring2"><img src="assets/items/ring2.png" alt=""><span class="slot-label">Кольцо 2</span></div>

                <!-- Ряд 3 -->
                <div class="slot slot-weapon"><img src="assets/items/weapon.png" alt=""><span class="slot-label">Оружие</span></div>
                <div class="slot slot-armor"><img src="assets/items/armor.png" alt=""><span class="slot-label">Броня</span></div>
                <div class="slot slot-shield"><img src="assets/items/shield.png" alt=""><span class="slot-label">Щит</span></div>

                <!-- Ряд 4 -->
                <div class="slot slot-gloves"><img src="assets/items/gloves.png" alt=""><span class="slot-label">Перчатки</span></div>
                <div class="slot slot-pants"><img src="assets/items/pants.png" alt=""><span class="slot-label">Штаны</span></div>
                <div class="slot slot-boots"><img src="assets/items/boots.png" alt=""><span class="slot-label">Обувь</span></div>
            </div>
        </div>

        <!-- Итоговые эффекты -->
        <div class="bottom-area">
            <div class="derived-stats">
                <div class="ds-title">Итоговые Эффекты</div>
                <div class="ds-grid">
                    <div class="ds-row"><span class="ds-name">⚔️ Урон</span><span class="ds-val" id="ds-dmg">150</span></div>
                    <div class="ds-row"><span class="ds-name">🛡️ Защита</span><span class="ds-val" id="ds-def">35%</span></div>
                    <div class="ds-row"><span class="ds-name">❤️ ХП</span><span class="ds-val" id="ds-hp">1000</span></div>
                    <div class="ds-row"><span class="ds-name">💥 Крит</span><span class="ds-val" id="ds-crit">8%</span></div>
                    <div class="ds-row"><span class="ds-name">🪞 Блок</span><span class="ds-val" id="ds-block">5%</span></div>
                    <div class="ds-row"><span class="ds-name">🧊 Резист</span><span class="ds-val" id="ds-res">10%</span></div>
                </div>
            </div>

            <div class="inv-title">Инвентарь (Страница <span id="current-page">1</span> из 5)</div>
            <div class="inv-grid" id="inv-grid"></div>

            <div class="inv-pagination">
                <button class="page-btn" onclick="changePage(1)">1</button>
                <button class="page-btn" onclick="changePage(2)">2</button>
                <button class="page-btn" onclick="changePage(3)">3</button>
                <button class="page-btn" onclick="changePage(4)">4</button>
                <button class="page-btn" onclick="changePage(5)">5</button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;

        // Генерируем 28 ячеек (7 колонок x 4 ряда)
        function renderInventory() {
            const grid = document.getElementById('inv-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 28; i++) {
                const slot = document.createElement('div');
                slot.classList.add('inv-slot');
                grid.appendChild(slot);
            }
        }

        function changePage(page) {
            currentPage = page;
            document.getElementById('current-page').innerText = page;
            const buttons = document.querySelectorAll('.page-btn');
            buttons.forEach((btn, index) => {
                btn.classList.remove('active');
                if (index + 1 === page) btn.classList.add('active');
            });
        }

        window.onload = function() {
            renderInventory();
            changePage(1);
        };
    </script>
</body>
</html>
