<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle & Power - Город</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Главный контейнер города */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('assets/city/bg_lobby.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ ИГРОКА (Двухуровневая: Сверху статы, ниже валюты) */
        .top-bar {
            width: 100%;
            padding: 10px 12px;
            background: linear-gradient(to bottom, rgba(5, 5, 15, 0.98) 80%, rgba(5, 5, 15, 0.7) 90%, rgba(0,0,0,0));
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        /* Первая строка: Аватар, ХП, Энергия, Локация */
        .top-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .player-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Кружок уровня персонажа */
        .level-circle {
            position: relative;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            border: 2px solid #00d2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .level-value {
            color: #00d2ff;
            font-weight: 900;
            font-size: 15px;
            text-shadow: 0 0 5px rgba(0, 210, 255, 0.8);
        }

        /* Контейнер для полосок ХП и Энергии */
        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 120px;
        }

        .status-bar-wrapper {
            position: relative;
            width: 100%;
            height: 15px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            overflow: hidden;
        }

        .status-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ХП — ЗЕЛЕНАЯ */
        .bar-hp { border-color: rgba(34, 197, 94, 0.3); }
        .bar-hp .status-bar-fill {
            background: linear-gradient(to right, #15803d, #22c55e);
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        /* Энергия — СИНЯЯ */
        .bar-energy { border-color: rgba(59, 130, 246, 0.3); }
        .bar-energy .status-bar-fill {
            background: linear-gradient(to right, #1d4ed8, #3b82f6);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }

        .bar-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 9px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        /* Вторая строка: Золото, Алмазы, Мечи */
        .top-resources-row {
            display: flex;
            gap: 12px;
            align-items: center;
            padding-left: 2px;
        }

        /* Общий вид плашки под каждую валюту */
        .resource-box {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 75px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .resource-icon {
            font-size: 13px;
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.2));
        }

        .resource-value {
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        /* Цвета контуров для разных валют */
        .res-gold { border-color: rgba(234, 179, 8, 0.4); box-shadow: 0 0 5px rgba(234, 179, 8, 0.15); }
        .res-gold .resource-value { color: #facc15; }

        .res-diamonds { border-color: rgba(6, 182, 212, 0.4); box-shadow: 0 0 5px rgba(6, 182, 212, 0.15); }
        .res-diamonds .resource-value { color: #22d3ee; }

        .res-swords { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 5px rgba(239, 68, 68, 0.15); }
        .res-swords .resource-value { color: #f87171; }

        /* Локация и язык */
        .top-right-block {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .location-badge {
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px 3px #000;
        }

        .lang-switcher {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #00d2ff;
            color: #00d2ff;
            border-radius: 4px;
            padding: 1px 4px;
            font-size: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        /* ИГРОВАЯ ЗОНА СО ЗДАНИЯМИ */
        .world-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        .building-zone {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px dashed rgba(0, 210, 255, 0.3); 
        }

        .building-label {
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid #00d2ff;
            border-radius: 6px;
            padding: 4px 10px;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .building-zone:hover .building-label,
        .building-zone:active .building-label {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 15px #00d2ff;
            transform: scale(1.05);
        }

        /* Координаты зданий */
        .zone-tavern { top: 35%; left: 10%; width: 25%; height: 20%; }
        .zone-forge { top: 30%; right: 10%; width: 25%; height: 22%; }
        .zone-arena { top: 55%; left: 35%; width: 30%; height: 20%; }
        .zone-castle { top: 15%; left: 37%; width: 26%; height: 18%; }

        /* Кнопка вызова чата */
        .chat-toggle-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 55px;
            height: 55px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #ff007f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            z-index: 20;
        }
        .chat-icon { width: 24px; height: 24px; fill: #ff007f; }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="top-bar">
            <!-- Верхняя строка: Профиль и локация -->
            <div class="top-main-row">
                <div class="player-profile">
                    <!-- Кружок уровня -->
                    <div class="level-circle">
                        <span id="player-level" class="level-value">1</span>
                    </div>
                    <!-- Полоски ХП и Энергии -->
                    <div class="bars-container">
                        <!-- Зеленое ХП -->
                        <div class="status-bar-wrapper bar-hp">
                            <div id="hp-fill" class="status-bar-fill" style="width: 100%;"></div>
                            <div id="hp-text" class="bar-text">1000 / 1000</div>
                        </div>
                        <!-- Синяя Энергия -->
                        <div class="status-bar-wrapper bar-energy">
                            <div id="energy-fill" class="status-bar-fill" style="width: 100%;"></div>
                            <div id="energy-text" class="bar-text">60 / 60</div>
                        </div>
                    </div>
                </div>

                <!-- Правый блок инфо -->
                <div class="top-right-block">
                    <span id="txt-location" class="location-badge">📍 Capital</span>
                    <button class="lang-switcher" onclick="toggleLanguage()">Language: RU</button>
                </div>
            </div>

            <!-- Нижняя строка: Золото, Алмазы, Мечи -->
            <div class="top-resources-row">
                <!-- Золото -->
                <div class="resource-box res-gold">
                    <span class="resource-icon">💰</span>
                    <span id="res-gold-val" class="resource-value">1,250</span>
                </div>
                <!-- Алмазы -->
                <div class="resource-box res-diamonds">
                    <span class="resource-icon">💎</span>
                    <span id="res-diam-val" class="resource-value">150</span>
                </div>
                <!-- Мечи -->
                <div class="resource-box res-swords">
                    <span class="resource-icon">⚔️</span>
                    <span id="res-swords-val" class="resource-value">45</span>
                </div>
            </div>
        </div>

        <!-- СЛОЙ ИНТЕРАКТИВНЫХ ЗДАНИЙ -->
        <div class="world-content">
            <div class="building-zone zone-tavern" onclick="openLocation('tavern')">
                <div id="lbl-tavern" class="building-label">Tavern</div>
            </div>

            <div class="building-zone zone-forge" onclick="openLocation('forge')">
                <div id="lbl-forge" class="building-label">Forge</div>
            </div>

            <div class="building-zone zone-arena" onclick="openLocation('square')">
                <div id="lbl-square" class="building-label">Square</div>
            </div>

            <div class="building-zone zone-castle" onclick="openLocation('pvp_arena')">
                <div id="lbl-castle" class="building-label">PvP Arena</div>
            </div>
        </div>

        <!-- Кнопка чата -->
        <div class="chat-toggle-btn">
            <svg class="chat-icon" viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
            </svg>
        </div>
    </div>

    <script>
        // ===== КОНСТАНТЫ =====
        const SERVER_URL = 'https://shanty-haven-silo.ngrok-free.dev';
        let currentLang = 'ru'; 

        const LANGUAGES = {
            ru: {
                location: "📍 Столица",
                tavern: "Таверна",
                forge: "Кузница",
                square: "Рыночная площадь",
                castle: "Арена PvP",
                entered: "Вы вошли в локацию: "
            },
            en: {
                location: "📍 Capital",
                tavern: "Tavern",
                forge: "Forge",
                square: "Market Square",
                castle: "PvP Arena",
                entered: "You entered location: "
            }
        };

        // ===== ИНИЦИАЛИЗАЦИЯ TELEGRAM =====
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            const tgLang = tg.initDataUnsafe?.user?.language_code;
            if (tgLang && LANGUAGES[tgLang]) {
                currentLang = tgLang;
            }
        }

        // ===== ФУНКЦИИ ОБНОВЛЕНИЯ UI =====
        function updatePlayerStatsUI(currentHp, maxHp, currentEnergy, maxEnergy, level) {
            document.getElementById('player-level').innerText = level;

            const hpPercent = Math.max(0, Math.min(100, (currentHp / maxHp) * 100));
            const energyPercent = Math.max(0, Math.min(100, (currentEnergy / maxEnergy) * 100));

            document.getElementById('hp-fill').style.width = `${hpPercent}%`;
            document.getElementById('energy-fill').style.width = `${energyPercent}%`;

            document.getElementById('hp-text').innerText = `${currentHp} / ${maxHp}`;
            document.getElementById('energy-text').innerText = `${currentEnergy} / ${maxEnergy}`;
        }

        function updatePlayerResourcesUI(gold, diamonds, swords) {
            document.getElementById('res-gold-val').innerText = gold.toLocaleString();
            document.getElementById('res-diam-val').innerText = diamonds.toLocaleString();
            document.getElementById('res-swords-val').innerText = swords.toLocaleString();
        }

        function applyLocalization() {
            const t = LANGUAGES[currentLang];
            document.getElementById('txt-location').innerText = t.location;
            document.getElementById('lbl-tavern').innerText = t.tavern;
            document.getElementById('lbl-forge').innerText = t.forge;
            document.getElementById('lbl-square').innerText = t.square;
            document.getElementById('lbl-castle').innerText = t.castle;
            document.querySelector('.lang-switcher').innerText = `Language: ${currentLang.toUpperCase()}`;
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'ru') ? 'en' : 'ru';
            applyLocalization();
        }

        function openLocation(locationId) {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            const t = LANGUAGES[currentLang];
            let locName = t[locationId === 'pvp_arena' ? 'castle' : (locationId === 'square' ? 'square' : locationId)];
            alert(t.entered + locName);
        }

        // ===== ЗАГРУЗКА ДАННЫХ ИГРОКА =====
        function loadPlayerData() {
            // Получаем tg_id
            let tgId = 777;
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgId = tg.initDataUnsafe.user.id;
            }

            console.log("Загрузка данных игрока для TG_ID:", tgId);

            // Запрашиваем данные игрока с сервера
            fetch(`${SERVER_URL}/api/get-player-data`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tg_id: tgId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.player) {
                    const player = data.player;
                    // Обновляем UI
                    updatePlayerStatsUI(
                        player.hp || 1000,
                        player.max_hp || 1000,
                        player.energy || 60,
                        player.max_energy || 60,
                        player.level || 1
                    );
                    updatePlayerResourcesUI(
                        player.gold || 500,
                        player.diamonds || 10,
                        player.swords || 0
                    );
                } else {
                    console.warn("Не удалось загрузить данные игрока, используем значения по умолчанию");
                }
            })
            .catch(err => {
                console.error("Ошибка загрузки данных игрока:", err);
                // Используем значения по умолчанию
                updatePlayerStatsUI(1000, 1000, 60, 60, 1);
                updatePlayerResourcesUI(500, 10, 0);
            });
        }

        // ===== СТАРТ =====
        window.onload = function() {
            applyLocalization();
            // Загружаем данные игрока с сервера
            loadPlayerData();
        };
    </script>
</body>
</html>
