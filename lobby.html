<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle & Power - Город</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Главный контейнер города */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('assets/city/bg_lobby.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ (Прозрачная, Flex строка) */
        .top-bar {
            width: 100%;
            padding: 10px 15px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        /* ===== ЛЕВАЯ ЧАСТЬ (Уровень + 3 полоски в одну линию) ===== */
        .left-stats {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Уменьшенный кружок уровня */
        .level-circle {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            border: 2px solid #00d2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            flex-shrink: 0;
        }

        .level-value {
            color: #00d2ff;
            font-weight: 900;
            font-size: 14px;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.8);
        }

        /* Общий блок полосок (ХП, Энергия, XP) */
        .stats-wrapper {
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            width: 155px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-icon {
            font-size: 10px;
            width: 12px;
            text-align: center;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
            color: #f8fafc;
        }

        .status-bar-wrapper {
            position: relative;
            flex-grow: 1;
            height: 8px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.9);
        }

        .status-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
        }

        /* ХП — КРАСНЫЙ */
        .bar-hp .status-bar-fill {
            background: linear-gradient(90deg, #b91c1c, #ef4444, #fca5a5);
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
        }

        /* Энергия — СИНИЙ */
        .bar-energy .status-bar-fill {
            background: linear-gradient(90deg, #1d4ed8, #3b82f6, #93c5fd);
            box-shadow: 0 0 6px rgba(59, 130, 246, 0.4);
        }

        /* Опыт (XP) — ФИОЛЕТОВЫЙ */
        .bar-xp .status-bar-fill {
            background: linear-gradient(90deg, #7c3aed, #a855f7, #fbbf24);
            box-shadow: 0 0 6px rgba(168, 85, 247, 0.4);
        }

        .bar-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 6px;
            font-weight: 900;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9), 0 0 4px #000;
            letter-spacing: 0.5px;
        }

        /* ===== ПРАВАЯ ЧАСТЬ (Валюты в одну линию) ===== */
        .right-resources {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .resource-box {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 3px 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            height: 26px;
        }

        .resource-icon {
            font-size: 12px;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
        }

        .resource-value {
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        .res-gold .resource-value { color: #facc15; }
        .res-diamonds .resource-value { color: #22d3ee; }
        .res-swords .resource-value { color: #f87171; }

        /* ===== ИГРОВАЯ ЗОНА (Сияющие точки на карте) ===== */
        .world-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .building-zone {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            width: 60px;
            height: 60px;
        }

        .building-dot {
            width: 16px;
            height: 16px;
            background: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.8), 0 0 5px rgba(0,0,0,0.8);
            border: 2px solid #fff;
            transition: all 0.2s ease;
        }

        .building-zone:hover .building-dot,
        .building-zone:active .building-dot {
            transform: scale(1.5);
            background: #fff;
            box-shadow: 0 0 30px #00d2ff, 0 0 10px #00d2ff;
        }

        /* Позиции зданий */
        .zone-tavern { top: 48%; left: 16%; }
        .zone-forge { top: 30%; right: 14%; }
        .zone-arena { top: 70%; left: 35%; }
        .zone-castle { top: 18%; left: 42%; }

    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ: ЛЕВО (Статы) и ПРАВО (Валюты) -->
        <div class="top-bar">
            
            <!-- ЛЕВАЯ ЧАСТЬ: Уровень + Полоски -->
            <div class="left-stats">
                
                <!-- Кружок уровня -->
                <div class="level-circle">
                    <span id="player-level" class="level-value">1</span>
                </div>

                <!-- Три полоски в ряд -->
                <div class="stats-wrapper">
                    
                    <!-- ХП -->
                    <div class="stat-row">
                        <span class="stat-icon">❤️</span>
                        <div class="status-bar-wrapper bar-hp">
                            <div id="hp-fill" class="status-bar-fill" style="width: 100%;"></div>
                            <div id="hp-text" class="bar-text">1000 / 1000</div>
                        </div>
                    </div>

                    <!-- ЭНЕРГИЯ -->
                    <div class="stat-row">
                        <span class="stat-icon">⚡</span>
                        <div class="status-bar-wrapper bar-energy">
                            <div id="energy-fill" class="status-bar-fill" style="width: 100%;"></div>
                            <div id="energy-text" class="bar-text">60 / 60</div>
                        </div>
                    </div>

                    <!-- ОПЫТ (XP) -->
                    <div class="stat-row">
                        <span class="stat-icon">✦</span>
                        <div class="status-bar-wrapper bar-xp">
                            <div id="xp-fill" class="status-bar-fill" style="width: 45%;"></div>
                            <div id="xp-text" class="bar-text">450 / 1000</div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- ПРАВАЯ ЧАСТЬ: Валюты в одну линию -->
            <div class="right-resources">
                <div class="resource-box res-gold">
                    <span class="resource-icon">💰</span>
                    <span id="res-gold-val" class="resource-value">1,250</span>
                </div>
                <div class="resource-box res-diamonds">
                    <span class="resource-icon">💎</span>
                    <span id="res-diam-val" class="resource-value">150</span>
                </div>
                <div class="resource-box res-swords">
                    <span class="resource-icon">⚔️</span>
                    <span id="res-swords-val" class="resource-value">45</span>
                </div>
            </div>

        </div>

        <!-- СЛОЙ ИНТЕРАКТИВНЫХ ТОЧЕК НА КАРТЕ -->
        <div class="world-content">
            <div class="building-zone zone-tavern" onclick="openLocation('tavern')">
                <div class="building-dot"></div>
            </div>

            <div class="building-zone zone-forge" onclick="openLocation('forge')">
                <div class="building-dot"></div>
            </div>

            <div class="building-zone zone-arena" onclick="openLocation('square')">
                <div class="building-dot"></div>
            </div>

            <div class="building-zone zone-castle" onclick="openLocation('pvp_arena')">
                <div class="building-dot"></div>
            </div>
        </div>

    </div>

    <script>
        // ===== КОНСТАНТЫ =====
        const SERVER_URL = 'https://shanty-haven-silo.ngrok-free.dev';
        let currentLang = 'en'; 

        const LANGUAGES = {
            ru: {
                tavern: "Таверна",
                forge: "Кузница",
                square: "Рыночная площадь",
                castle: "Арена PvP",
                entered: "Вы вошли в локацию: "
            },
            en: {
                tavern: "Tavern",
                forge: "Forge",
                square: "Square",
                castle: "PvP Arena",
                entered: "You entered location: "
            }
        };

        // ===== ИНИЦИАЛИЗАЦИЯ TELEGRAM =====
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            const tgLang = tg.initDataUnsafe?.user?.language_code;
            if (tgLang && LANGUAGES[tgLang]) {
                currentLang = tgLang;
            }
        }

        // ===== ФУНКЦИИ ОБНОВЛЕНИЯ UI =====
        function updatePlayerStatsUI(currentHp, maxHp, currentEnergy, maxEnergy, level, currentXp, maxXp) {
            document.getElementById('player-level').innerText = level;

            const hpPercent = Math.max(0, Math.min(100, (currentHp / maxHp) * 100));
            const energyPercent = Math.max(0, Math.min(100, (currentEnergy / maxEnergy) * 100));
            const xpPercent = Math.max(0, Math.min(100, (currentXp / maxXp) * 100));

            document.getElementById('hp-fill').style.width = `${hpPercent}%`;
            document.getElementById('energy-fill').style.width = `${energyPercent}%`;
            document.getElementById('xp-fill').style.width = `${xpPercent}%`;

            document.getElementById('hp-text').innerText = `${currentHp} / ${maxHp}`;
            document.getElementById('energy-text').innerText = `${currentEnergy} / ${maxEnergy}`;
            document.getElementById('xp-text').innerText = `${currentXp} / ${maxXp}`;
        }

        function updatePlayerResourcesUI(gold, diamonds, swords) {
            document.getElementById('res-gold-val').innerText = gold.toLocaleString();
            document.getElementById('res-diam-val').innerText = diamonds.toLocaleString();
            document.getElementById('res-swords-val').innerText = swords.toLocaleString();
        }

        function openLocation(locationId) {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            const t = LANGUAGES[currentLang];
            let locName = t[locationId === 'pvp_arena' ? 'castle' : (locationId === 'square' ? 'square' : locationId)];
            alert(t.entered + locName);
        }

        // ===== ЗАГРУЗКА ДАННЫХ ИГРОКА (Строгая логика) =====
        function loadPlayerData() {
            let tgId = 777;
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgId = tg.initDataUnsafe.user.id;
            }

            console.log("Загрузка данных игрока для TG_ID:", tgId);

            fetch(`${SERVER_URL}/api/get-player-data`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tg_id: tgId })
            })
            .then(response => {
                if (!response.ok) throw new Error('Server error');
                return response.json();
            })
            .then(data => {
                // 1. Если сервер сказал, что это новый игрок - кидаем на выбор класса
                if (data.status === 'new_player' || !data.player) {
                    window.location.href = 'select.html';
                    return;
                }

                // 2. Если игрок есть - загружаем лобби
                if (data.success && data.player) {
                    const player = data.player;
                    updatePlayerStatsUI(
                        player.hp || 1000,
                        player.max_hp || 1000,
                        player.energy || 60,
                        player.max_energy || 60,
                        player.level || 1,
                        player.xp || 450,
                        player.max_xp || 1000
                    );
                    updatePlayerResourcesUI(
                        player.gold || 500,
                        player.diamonds || 10,
                        player.swords || 0
                    );
                }
            })
            .catch(err => {
                // 3. Если сервер упал или нет интернета - БЛОКИРУЕМ ИГРУ!
                console.error("Ошибка загрузки данных игрока:", err);
                document.body.innerHTML = `
                    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; background-color: #0f172a; color: #fff; text-align: center; font-family: sans-serif; padding: 20px;">
                        <div style="font-size: 60px; margin-bottom: 20px;">📡</div>
                        <h2 style="color: #ff4d4d; margin-bottom: 10px;">Нет соединения с сервером</h2>
                        <p style="opacity: 0.8;">Проверьте интернет или попробуйте зайти позже.</p>
                    </div>
                `;
            });
        }

        // ===== СТАРТ =====
        window.onload = function() {
            loadPlayerData();
        };
    </script>
</body>
</html>
