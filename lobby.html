<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle & Power - Город</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Главный контейнер города */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('assets/city/bg_lobby.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Верхняя панель */
        .top-bar {
            width: 100%;
            padding: 12px 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            z-index: 10;
        }

        /* ИГРОВАЯ ЗОНА СО ЗДАНИЯМИ */
        .world-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        /* Общий стиль для интерактивного здания (кликовая зона) */
        .building-zone {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* Включаем дебаг-рамку, чтобы видеть зону при настройке. Удали border, когда закончишь! */
            border: 1px dashed rgba(0, 210, 255, 0.4); 
        }

        /* Стильные таблички-надписи над зданиями */
        .building-label {
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid #00d2ff;
            border-radius: 6px;
            padding: 4px 10px;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            pointer-events: none; /* Чтобы клик проходил сквозь текст на саму зону */
            transition: all 0.2s ease;
        }

        /* Эффект при наведении (для ПК) и при тапе (для смартфонов) */
        .building-zone:hover .building-label,
        .building-zone:active .building-label {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 15px #00d2ff;
            transform: scale(1.05);
        }

        /* КООРДИНАТЫ ЗДАНИЙ (ПРИМЕРНЫЕ - ПОДПРАВЬ ПОД СВОЙ АРТ) */
        
        /* 1. ТАВЕРНА (слева сверху) */
        .zone-tavern {
            top: 35%;
            left: 10%;
            width: 25%;
            height: 20%;
        }

        /* 2. КУЗНИЦА (справа сверху) */
        .zone-forge {
            top: 30%;
            right: 10%;
            width: 25%;
            height: 22%;
        }

        /* 3. АРЕНА (по центру / внизу) */
        .zone-arena {
            top: 55%;
            left: 35%;
            width: 30%;
            height: 20%;
        }

        /* 4. ЗАМОК / ЦИТАДЕЛЬ (в глубине по центру) */
        .zone-castle {
            top: 15%;
            left: 37%;
            width: 26%;
            height: 18%;
        }


        /* КНОПКА И ШТОРКА ЧАТА (ОСТАВЛЯЕМ НА ПОТОМ) */
        .chat-toggle-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 55px;
            height: 55px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #ff007f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            z-index: 20;
        }
        .chat-icon { width: 24px; height: 24px; fill: #ff007f; }
        .chat-panel {
            position: absolute;
            bottom: -450px;
            left: 0;
            width: 100%;
            height: 420px;
            background: rgba(10, 15, 30, 0.95);
            border-top: 3px solid #ff007f;
            border-radius: 20px 20px 0 0;
            z-index: 30;
            transition: bottom 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Верхняя инфо-панель -->
        <div class="top-bar">
            <span id="player-hero-name">Загрузка героя...</span>
            <span>📍 Столица</span>
        </div>

        <!-- СЛОЙ ИНТЕРАКТИВНЫХ ЗДАНИЙ -->
        <div class="world-content">
            
            <!-- Таверна -->
            <div class="building-zone zone-tavern" onclick="openLocation('tavern')">
                <div class="building-label">Таверна</div>
            </div>

            <!-- Кузница -->
            <div class="building-zone zone-forge" onclick="openLocation('forge')">
                <div class="building-label">Кузница</div>
            </div>

            <!-- Арена -->
            <div class="building-zone zone-arena" onclick="openLocation('arena')">
                <div class="building-label">Арена PvP</div>
            </div>

            <!-- Замок -->
            <div class="building-zone zone-castle" onclick="openLocation('castle')">
                <div class="building-label">Замок Царя</div>
            </div>

        </div>

        <!-- Кнопка вызова чата (пусть пока просто висит визуально) -->
        <div class="chat-toggle-btn">
            <svg class="chat-icon" viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
            </svg>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand(); // Разворачиваем на весь экран смартфона
        }

        // Функция клика по зданиям
        function openLocation(locationId) {
            console.log("Вы нажали на локацию:", locationId);
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium'); // Легкая вибрация телефона при клике!
            }

            // Пока просто выводим алерт, далее будем открывать модалки или новые окна
            alert("Вы вошли в локацию: " + locationId.toUpperCase());
        }

        window.onload = function() {
            // Временная заглушка имени игрока
            document.getElementById('player-hero-name').innerText = "Рыцарь Света";
        };
    </script>
</body>
</html>
