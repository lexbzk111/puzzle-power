<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Power - Login</title>
    <style>
        /* Базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Фон страницы (светло-голубой) */
        body {
            background: linear-gradient(160deg, #dbeafe 0%, #eff6ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Сама белая карточка (рамка) */
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 35px 30px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.15); /* Голубая тень */
            text-align: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Блок с персонажем (сделал его крупнее) */
        .character-container {
            margin-bottom: 15px;
        }

        .character-img {
            width: 130px; /* Увеличили размер */
            height: 130px;
            object-fit: contain;
            border-radius: 50%;
            background: #f0f9ff; /* Светло-голубой круг под персонажем */
            padding: 15px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            /* Ссылка на картинку. Если картинка не прогрузится, будет иконка */
            content: url('https://cdn-icons-png.flaticon.com/512/4322/4322991.png');
        }

        /* Заголовки */
        h1 {
            color: #0ea5e9; /* Голубой цвет логотипа */
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Поля ввода */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0; /* Светло-серая рамка */
            border-radius: 20px;
            background: #f8fafc;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #0ea5e9; /* Голубая рамка при нажатии */
            background: #ffffff;
        }

        /* Кнопка входа */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #0ea5e9; /* Ярко-голубой фон */
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .btn-login:hover {
            background: #0284c7;
            transform: scale(1.02);
        }

        /* Ссылки внизу */
        .footer-links {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .footer-links a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
        
        /* Крестик закрытия (как на скрине) */
        .close-icon {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            color: #94a3b8;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Крестик закрытия -->
        <div class="close-icon">✕</div>

        <!-- Картинка персонажа (крупная) -->
        <div class="character-container">
            <img class="character-img" src="https://cdn-icons-png.flaticon.com/512/4322/4322991.png" alt="Персонаж">
        </div>

        <!-- Тексты -->
        <h1>PUZZLE & POWER</h1>
        <p class="subtitle">Войдите в мир приключений</p>

        <!-- Форма -->
        <form>
            <div class="input-group">
                <label>Логин или Email</label>
                <input type="text" placeholder="Введите логин">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" placeholder="Введите пароль">
            </div>
            <button type="button" class="btn-login">Войти</button>
        </form>

        <!-- Ссылки -->
        <div class="footer-links">
            <a href="#">Забыли пароль?</a>
            <a href="#">Регистрация</a>
        </div>
        
        <div style="margin-top: 15px; font-size: 12px; color: #cbd5e1;">
            @puzzlepower_bot
        </div>
    </div>

</body>
</html>
