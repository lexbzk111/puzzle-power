<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle & Power - Создание Героя</title>
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Главный контейнер с фоном создания персонажа */
        .creation-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('assets/bg_creation.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* ЛЕВАЯ ЧАСТЬ: ПЛАТФОРМА И ПЕРСОНАЖ */
        .left-side {
            position: relative;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
        }

        .avatar-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: -20px;
            z-index: 2;
        }

        .char-avatar {
            height: 65vh;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.3));
            transition: transform 0.3s ease;
        }

        /* Стрелочки переключения пола */
        .gender-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #00d2ff;
            color: #00d2ff;
            font-size: 24px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            z-index: 10;
            transition: all 0.2s ease;
        }

        .gender-arrow:active { transform: translateY(-50%) scale(0.9); }
        .arrow-left { left: 10px; }
        .arrow-right { right: 10px; }

        /* Парящая платформа под персонажем */
        .platform {
            width: 80%;
            height: 60px;
            background: radial-gradient(ellipse at center, rgba(0,210,255,0.4) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            animation: floatPlatform 4s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes floatPlatform {
            0% { transform: translateY(0px) scale(1); opacity: 0.8; }
            50% { transform: translateY(-10px) scale(1.05); opacity: 1; }
            100% { transform: translateY(0px) scale(1); opacity: 0.8; }
        }

        /* Синие неоновые кнопки выбора классов (внизу в облаках) */
        .class-selector-bar {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            display: flex;
            justify-content: space-around;
            gap: 10px;
            z-index: 5;
        }

        .class-btn {
            flex: 1;
            background: rgba(10, 15, 30, 0.75);
            border: 1px solid #00d2ff;
            border-radius: 12px;
            color: #00d2ff;
            padding: 12px 5px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
            transition: all 0.2s ease;
            text-align: center;
        }

        .class-btn.active {
            background: #00d2ff;
            color: #020208;
            box-shadow: 0 0 20px #00d2ff;
        }

        /* ПРАВАЯ ЧАСТЬ: ИНТЕРФЕЙС И ХАРАКТЕРИСТИКИ */
        .right-side {
            width: 45%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            z-index: 5;
        }

        /* Вертикальный блок из 5 текстовых рамок характеристик */
        .stats-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            backdrop-filter: blur(5px);
        }

        .stat-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 210, 255, 0.15);
            border-radius: 8px;
            padding: 10px 15px;
            color: #e2e8f0;
            font-size: 14px;
        }

        .stat-name {
            font-weight: 500;
            color: #94a3b8;
        }

        .stat-value {
            font-weight: bold;
            color: #00d2ff;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
        }

        /* Рамка ввода имени "ИМЯ" */
        .name-input-wrapper {
            width: 100%;
        }

        .hero-name-input {
            width: 100%;
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            outline: none;
            letter-spacing: 1px;
            transition: border-color 0.2s;
        }

        .hero-name-input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
        }

        /* Кнопка отправки персонажа в БД */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
            transition: all 0.2s ease;
        }

        .submit-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 102, 255, 0.4);
        }
</style>
</head>
<body>

    <div class="creation-container">
        
        <!-- ЛЕВАЯ ЧАСТЬ: ПЕРСОНАЖ И СТРЕЛКИ -->
        <div class="left-side">
            <!-- Стрелочки выбора пола -->
            <button class="gender-arrow arrow-left" onclick="changeGender('left')">&#10094;</button>
            
            <div class="avatar-wrapper">
                <img id="char-avatar" class="char-avatar" src="assets/char_male.png" alt="Персонаж">
            </div>
            
            <!-- Парящая платформа -->
            <div class="platform"></div>

            <button class="gender-arrow arrow-right" onclick="changeGender('right')">&#10095;</button>

            <!-- Синие кнопки классов под платформой -->
            <div class="class-selector-bar">
                <button id="btn-warrior" class="class-btn active" onclick="selectClass('warrior')">Воин</button>
                <button id="btn-mage" class="class-btn" onclick="selectClass('mage')">Маг</button>
                <button id="btn-rogue" class="class-btn" onclick="selectClass('rogue')">Разбойник</button>
            </div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ: ХАРАКТЕРИСТИКИ И ВВОД ИМЕНИ -->
        <div class="right-side">
            
            <!-- Вертикальный блок из 5 характеристик -->
            <div class="stats-block">
                <div class="stat-box">
                    <span class="stat-name">Сила</span>
                    <span id="stat-str" class="stat-value">14</span>
                </div>
                <div class="stat-box">
                    <span class="stat-name">Ловкость</span>
                    <span id="stat-dex" class="stat-value">10</span>
                </div>
                <div class="stat-box">
                    <span class="stat-name">Интеллект</span>
                    <span id="stat-int" class="stat-value">6</span>
                </div>
                <div class="stat-box">
                    <span class="stat-name">Стойкость</span>
                    <span id="stat-sta" class="stat-value">12</span>
                </div>
                <div class="stat-box">
                    <span class="stat-name">Удача</span>
                    <span id="stat-luc" class="stat-value">8</span>
                </div>
            </div>

            <!-- Ввод имени -->
            <div class="name-input-wrapper">
                <input type="text" id="hero-name" class="hero-name-input" placeholder="ИМЯ" maxlength="16" autocomplete="off">
            </div>

            <!-- Кнопка подтверждения -->
            <button class="submit-btn" onclick="createCharacter()">Создать Героя</button>

        </div>

    </div>

    <!-- ЛОГИКА И СЕТЬ -->
    <script>
        // НАСТРОЙКА СЕТИ И СЕРВЕРА
        const SERVER_URL = 'https://shanty-haven-silo.ngrok-free.dev';

        // Инициализация Telegram WebApp и получение ID игрока
        let tgId = 777; // Дефолтный ID для тестов в браузере ПК
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            if (window.Telegram.WebApp.initDataUnsafe?.user) {
                tgId = window.Telegram.WebApp.initDataUnsafe.user.id;
            }
        }

        // Текущее состояние выбора персонажа
        let currentGender = 'male';
        let currentClass = 'warrior';

        // Базовые характеристики классов
        const classStats = {
            warrior: { strength: 14, dexterity: 10, intelligence: 6, stamina: 12, luck: 8 },
            mage:    { strength: 5,  dexterity: 9,  intelligence: 15, stamina: 7,  luck: 10 },
            rogue:   { strength: 9,  dexterity: 14, intelligence: 8,  stamina: 9,  luck: 12 }
        };

        // Текущие характеристики на экране
        let stats = { ...classStats.warrior };

        // 1. ФУНКЦИЯ ПЕРЕКЛЮЧЕНИЯ ПОЛА (Стрелочки)
        function changeGender(direction) {
            currentGender = (currentGender === 'male') ? 'female' : 'male';
            
            // Обновляем картинку аватара персонажа
            const avatarImg = document.getElementById('char-avatar');
            if (avatarImg) {
                avatarImg.src = `assets/char_${currentGender}.png`;
            }
            
            console.log("Выбран пол:", currentGender);
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }

        // 2. ФУНКЦИЯ ВЫБОРА КЛАССА (Синие неоновые кнопки)
        function selectClass(className) {
            currentClass = className;
            
            // Сбрасываем активный класс у всех кнопок и красим выбранную
            document.querySelectorAll('.class-btn').forEach(btn => btn.classList.remove('active'));
            const selectedBtn = document.getElementById(`btn-${className}`);
            if (selectedBtn) selectedBtn.classList.add('active');

            // Копируем базовые статы выбранного класса
            stats = { ...classStats[className] };
            updateStatsUI();

            console.log("Выбран класс:", currentClass);
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }

        // 3. ФУНКЦИЯ ОБНОВЛЕНИЯ ХАРАКТЕРИСТИК НА ЭКРАНЕ
        function updateStatsUI() {
            const statElements = {
                strength: document.getElementById('stat-str'),
                dexterity: document.getElementById('stat-dex'),
                intelligence: document.getElementById('stat-int'),
                stamina: document.getElementById('stat-sta'),
                luck: document.getElementById('stat-luc')
            };

            for (const key in statElements) {
                if (statElements[key]) {
                    statElements[key].innerText = stats[key];
                }
            }
        }

        // 4. ФУНКЦИЯ ОТПРАВКИ ПЕРСОНАЖА В БАЗУ ДАННЫХ И ПЕРЕХОД В ГОРОД
        function createCharacter() {
            const nameInput = document.getElementById('hero-name');
            const heroName = nameInput ? nameInput.value.trim() : '';

            if (!heroName || heroName === 'ИМЯ') {
                alert('Пожалуйста, введите уникальное имя вашего героя!');
                return;
            }

            const payload = {
                tg_id: tgId,
                name: heroName,
                gender: currentGender,
                class: currentClass,
                stats: stats
            };

            console.log("Отправка персонажа на server.py:", payload);

            fetch(`${SERVER_URL}/api/create-character`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true' // Обходим заглушку ngrok
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    console.log("Персонаж успешно создан в PostgreSQL!");
                    // Мгновенный бесшовный переход на карту города!
                    window.location.href = "lobby.html"; 
                } else {
                    alert("Ошибка при создании персонажа: " + data.message);
                }
            })
            .catch(err => {
                console.error("Ошибка сети при создании героя:", err);
                // Резервный пропуск в город для тестов интерфейса без запущенного Python
                window.location.href = "lobby.html"; 
            });
        }

        // Первичная настройка статов при загрузке страницы
        window.onload = function() {
            updateStatsUI();
        };
    </script>
</body>
</html>
