<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle & Power - Login</title>
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe, #bae6fd); /* Светло-голубой градиент */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.8); /* Белый полупрозрачный фон */
            backdrop-filter: blur(15px); /* Эффект стекла */
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.2); /* Мягкая голубая тень */
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* КРУПНЫЙ ПЕРСОНАЖ */
        .character-img {
            width: 100%;
            max-width: 220px; /* Увеличили размер картинки */
            height: auto;
            margin: 0 auto 20px auto;
            display: block;
            border-radius: 15px;
            /* Ниже замените URL на вашу картинку с персонажем */
            content: url('https://via.placeholder.com/220x300/89CFF0/FFFFFF?text=Персонаж'); 
        }

        h1 {
            color: #0284c7; /* Насыщенный синий цвет логотипа */
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #3b82f6, #2563eb); /* Голубой градиент */
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .btn-login:hover {
            transform: scale(1.02);
            background: linear-gradient(to right, #2563eb, #1d4ed8);
        }

        .footer-links {
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }

        .footer-links a {
            color: #3b82f6;
            text-decoration: none;
            margin: 0 10px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- СЮДА ВСТАВЬТЕ ССЫЛКУ НА ВАШЕГО ПЕРСОНАЖА -->
        <img class="character-img" src="https://via.placeholder.com/220x300/89CFF0/FFFFFF?text=Персонаж" alt="Персонаж">

        <h1>PUZZLE & POWER</h1>
        <p class="subtitle">Войдите в мир приключений</p>

        <form>
            <div class="input-group">
                <label>Логин или Email</label>
                <input type="text" placeholder="Введите логин">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" placeholder="Введите пароль">
            </div>
            <button type="submit" class="btn-login">Войти</button>
        </form>

        <div class="footer-links">
            <a href="#">Забыли пароль?</a>
            <a href="#">Регистрация</a>
        </div>
    </div>

</body>
</html>
