<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puzzle & Power — Создание Героя</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #0b0a09;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 12px;
    }

    /* ===== ГЛАВНАЯ РАМКА ===== */
    .frame-container {
      max-width: 480px;
      width: 100%;
      background: #1e1a16;
      border: 6px double #b8945c;
      border-radius: 32px 32px 28px 28px;
      padding: 20px 16px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 2px #3d3228 inset, 0 0 0 4px #5a4a36 inset;
      position: relative;
    }

    /* декоративный уголок */
    .frame-container::before {
      content: "⚜";
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1a16;
      padding: 0 16px;
      color: #d4b48c;
      font-size: 22px;
      letter-spacing: 6px;
      text-shadow: 0 0 6px #b8945c55;
    }

    /* ===== ЗАГОЛОВОК ===== */
    .frame-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #ecd5b3;
      text-shadow: 0 2px 0 #3f2e1e, 0 0 12px #c3a47566;
      margin-top: -6px;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px dashed #7a674a;
      text-transform: uppercase;
      word-break: break-word;
    }
    .frame-title small {
      display: block;
      font-size: 11px;
      font-weight: normal;
      opacity: 0.7;
      letter-spacing: 2px;
      margin-top: 2px;
    }

    /* ===== СЕТКА: лево (аватар+классы) / право (статы) ===== */
    .creation-grid {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* ---- ЛЕВАЯ КОЛОНКА ---- */
    .left-col {
      flex: 1 1 150px;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .avatar-block {
      position: relative;
      background: #2c241d;
      border-radius: 40px 40px 24px 24px;
      border: 2px solid #9b824f;
      box-shadow: inset 0 0 20px #0f0b08, 0 6px 10px #00000077;
      padding: 10px 4px 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 160px;
    }

    .gender-btn {
      background: transparent;
      border: none;
      font-size: 28px;
      color: #b8945c;
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
      text-shadow: 0 0 8px #ffd58c55;
      transition: 0.1s ease;
    }
    .gender-btn:active { transform: scale(0.8); }

    .hero-avatar {
      width: 80px;
      height: auto;
      max-height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px #000000aa);
      transition: 0.2s ease;
      image-rendering: pixelated;
    }

    /* классы (сетка 2x2) */
    .class-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .class-btn {
      background: #2a221b;
      border: 1.5px solid #7a674a;
      border-radius: 30px;
      padding: 8px 2px;
      font-size: 11px;
      font-weight: bold;
      color: #cbb295;
      text-shadow: 0 1px 2px black;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 2px 4px #00000066;
      font-family: 'Georgia', serif;
      text-align: center;
      line-height: 1.2;
      letter-spacing: 0.3px;
    }

    .class-btn.selected {
      border-color: #ff7b2b;
      background: #4d3321;
      color: #fff7e0;
      box-shadow: 0 0 16px #ff7b2b77, inset 0 0 8px #ff7b2b44;
    }

    /* ---- ПРАВАЯ КОЛОНКА (статы + имя + кнопка) ---- */
    .right-col {
      flex: 2 1 180px;
      min-width: 160px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* каждая характеристика — отдельная рамка */
    .stat-card {
      background: #231e19;
      border: 1.5px solid #9b824f;
      border-radius: 30px;
      padding: 4px 14px 4px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 2px 6px #0a0705, 0 2px 4px #00000088;
    }

    .stat-name {
      color: #dcc9ae;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px black;
    }

    .stat-value {
      background: #0f0b08;
      border: 1px solid #7a674a;
      border-radius: 40px;
      padding: 0 14px;
      font-size: 15px;
      font-weight: bold;
      color: #ffb86b;
      text-shadow: 0 0 8px #ff8833aa;
      min-width: 32px;
      text-align: center;
      box-shadow: inset 0 0 6px #000000;
    }

    /* поле ввода имени */
    .name-box {
      margin-top: 2px;
      background: #1a1511;
      border: 2px solid #9b824f;
      border-radius: 60px;
      padding: 4px 8px;
      box-shadow: inset 0 0 12px #0a0705;
    }

    .name-input {
      width: 100%;
      background: transparent;
      border: none;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #ecd5b3;
      font-family: 'Georgia', serif;
      padding: 8px 4px;
      outline: none;
      letter-spacing: 1px;
      text-shadow: 0 0 6px #b8945c55;
    }
    .name-input::placeholder {
      color: #6b5a44;
      font-weight: normal;
      opacity: 0.6;
    }

    /* кнопка создания */
    .create-btn {
      background: #3f2e1e;
      border: 2px solid #b8945c;
      border-radius: 60px;
      padding: 12px 8px;
      font-size: 16px;
      font-weight: bold;
      color: #f5e6d0;
      text-shadow: 0 2px 0 #1f150e;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 4px 0 #1f150e, 0 6px 16px #000000aa;
      font-family: 'Georgia', serif;
      letter-spacing: 1.5px;
      margin-top: 4px;
      text-align: center;
    }
    .create-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #1f150e, 0 6px 12px #000000aa;
    }

    /* ----- АДАПТИВ ----- */
    @media (max-width: 400px) {
      .frame-container { padding: 14px 12px 18px; }
      .stat-card { padding: 3px 10px 3px 14px; }
      .stat-name { font-size: 11px; }
      .stat-value { font-size: 13px; padding: 0 10px; min-width: 26px; }
      .class-btn { font-size: 10px; padding: 6px 2px; }
      .hero-avatar { width: 60px; }
      .gender-btn { font-size: 22px; }
      .frame-title { font-size: 17px; }
    }

    /* дополнительная стилизация для красоты */
    .frame-container {
      transition: all 0.2s;
    }
    .stat-card:last-of-type {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

<div class="frame-container">
  <div class="frame-title">
    Puzzle &amp; Power
    <small>⚔️ создание героя ⚔️</small>
  </div>

  <div class="creation-grid">
    <!-- ЛЕВАЯ ЧАСТЬ: аватар + классы -->
    <div class="left-col">
      <div class="avatar-block">
        <button class="gender-btn" id="prevGenderBtn" aria-label="предыдущий пол">◀</button>
        <img id="characterAvatar" class="hero-avatar" src="assets/char_male.png" alt="Герой">
        <button class="gender-btn" id="nextGenderBtn" aria-label="следующий пол">▶</button>
      </div>

      <div class="class-grid">
        <button class="class-btn selected" id="classWarrior" data-class="warrior">⚔️ Воин</button>
        <button class="class-btn" id="classTank" data-class="tank">🛡️ Танк</button>
        <button class="class-btn" id="classElf" data-class="elf">🧝 Эльф</button>
        <button class="class-btn" id="classMage" data-class="mage">🔮 Маг</button>
      </div>
    </div>

    <!-- ПРАВАЯ ЧАСТЬ: статы + имя + кнопка -->
    <div class="right-col">
      <!-- Каждая стата в своей рамке -->
      <div class="stat-card"><span class="stat-name">💪 Сила</span><span class="stat-value" id="statStr">15</span></div>
      <div class="stat-card"><span class="stat-name">🏹 Ловкость</span><span class="stat-value" id="statAgl">12</span></div>
      <div class="stat-card"><span class="stat-name">🧠 Интуиция</span><span class="stat-value" id="statInt">10</span></div>
      <div class="stat-card"><span class="stat-name">❤️ Выносливость</span><span class="stat-value" id="statVit">13</span></div>
      <div class="stat-card"><span class="stat-name">🕯️ Мудрость</span><span class="stat-value" id="statWis">5</span></div>

      <!-- Имя -->
      <div class="name-box">
        <input type="text" id="heroNameInput" class="name-input" placeholder="ИМЯ ГЕРОЯ" maxlength="14" value="ИМЯ">
      </div>

      <!-- Кнопка -->
      <button class="create-btn" id="createHeroBtn">⚡ СОЗДАТЬ</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ===== ДАННЫЕ =====
    const STATS_BY_CLASS = {
      warrior: { str: 15, agl: 12, int: 10, vit: 13, wis: 5 },
      tank:    { str: 12, agl: 8,  int: 10, vit: 20, wis: 5 },
      elf:     { str: 10, agl: 18, int: 14, vit: 9,  wis: 4 },
      mage:    { str: 5,  agl: 9,  int: 11, vit: 10, wis: 20 }
    };

    const IMAGES = {
      male: 'assets/char_male.png',
      female: 'assets/char_female.png'
    };

    // ===== СОСТОЯНИЕ =====
    let currentGender = 'male';
    let currentClass = 'warrior';

    // ===== DOM-элементы =====
    const avatar = document.getElementById('characterAvatar');
    const prevBtn = document.getElementById('prevGenderBtn');
    const nextBtn = document.getElementById('nextGenderBtn');

    const classBtns = document.querySelectorAll('.class-btn');

    const statStr = document.getElementById('statStr');
    const statAgl = document.getElementById('statAgl');
    const statInt = document.getElementById('statInt');
    const statVit = document.getElementById('statVit');
    const statWis = document.getElementById('statWis');

    const nameInput = document.getElementById('heroNameInput');
    const createBtn = document.getElementById('createHeroBtn');

    // ===== ОБНОВЛЕНИЕ СТАТОВ =====
    function updateStats(className) {
      const s = STATS_BY_CLASS[className];
      if (!s) return;
      statStr.textContent = s.str;
      statAgl.textContent = s.agl;
      statInt.textContent = s.int;
      statVit.textContent = s.vit;
      statWis.textContent = s.wis;
    }

    // ===== СМЕНА ПОЛА =====
    function setGender(gender) {
      if (gender !== 'male' && gender !== 'female') return;
      currentGender = gender;
      avatar.src = IMAGES[gender];
      // небольшая анимация (микроподтверждение)
      avatar.style.transform = 'scale(0.92)';
      setTimeout(() => { avatar.style.transform = 'scale(1)'; }, 100);
    }

    function switchGender(direction) {
      const genders = ['male', 'female'];
      let idx = genders.indexOf(currentGender);
      idx = (idx + direction + genders.length) % genders.length;
      setGender(genders[idx]);
    }

    // ===== ВЫБОР КЛАССА =====
    function selectClass(className) {
      currentClass = className;
      // подсветка
      classBtns.forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.class === className);
      });
      updateStats(className);
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    function init() {
      // вешаем события на кнопки пола
      prevBtn.addEventListener('click', () => switchGender(-1));
      nextBtn.addEventListener('click', () => switchGender(1));

      // события для классов
      classBtns.forEach(btn => {
        btn.addEventListener('click', function(e) {
          const cls = this.dataset.class;
          if (cls) selectClass(cls);
        });
      });

      // устанавливаем значения по умолчанию
      setGender('male');
      selectClass('warrior');
      // имя по умолчанию
      if (nameInput.value.trim() === '') nameInput.value = 'ИМЯ';

      // ===== КНОПКА СОЗДАТЬ =====
      createBtn.addEventListener('click', function() {
        const name = nameInput.value.trim();
        if (!name || name === 'ИМЯ' || name === 'NAME') {
          alert('Дай имя своему герою!');
          return;
        }

        // собираем данные
        const stats = {
          str: parseInt(statStr.textContent, 10),
          agl: parseInt(statAgl.textContent, 10),
          int: parseInt(statInt.textContent, 10),
          vit: parseInt(statVit.textContent, 10),
          wis: parseInt(statWis.textContent, 10)
        };

        // получаем tg_id (если есть)
        let tgId = 777;
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
          tgId = window.Telegram.WebApp.initDataUnsafe.user.id;
        }

        const payload = {
          tg_id: tgId,
          name: name,
          gender: currentGender,
          class_name: currentClass,
          stats: stats
        };

        console.log('📦 Отправка в БД:', payload);

        // Здесь должен быть реальный fetch, но для демо — показываем alert
        // (закомментирован, чтобы не было ошибки CORS при локальном тесте)
        /*
        fetch('https://ngrok-free.dev/api/create-character', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            window.location.href = 'index.html';
          } else {
            alert('Ошибка: ' + (data.message || 'неизвестная'));
          }
        })
        .catch(err => {
          alert('Не удалось подключиться к серверу.');
          console.error(err);
        });
        */

        // Вместо реального запроса — показываем успех (для демонстрации рамки)
        alert(`✅ Герой "${name}" (${currentClass}) создан!\nСтаты: ${stats.str}/${stats.agl}/${stats.int}/${stats.vit}/${stats.wis}`);
        // при реальном использовании раскомментировать fetch и закомментировать alert выше
      });

      // автофокус на имя (по желанию)
      // nameInput.focus();
    }

    // запускаем после загрузки
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
</script>
</body>
</html>
