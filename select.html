<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор класса</title>
    <script src="https://telegram.org"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', sans-serif; color: #fff; }
        .select-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 70%); }
        .game-title { font-size: 28px; font-weight: 900; color: #00d2ff; margin-bottom: 30px; text-shadow: 0 0 20px rgba(0, 210, 255, 0.4); }
        .sub-title { font-size: 14px; color: #94a3b8; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .class-card { background: #1e293b; border: 2px solid #334155; border-radius: 12px; width: 100%; max-width: 320px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .class-card:hover { border-color: #00d2ff; background: #263449; transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 210, 255, 0.3); }
        .class-icon { font-size: 40px; width: 50px; text-align: center; }
        .class-title { font-size: 18px; font-weight: bold; }
        .class-desc { font-size: 12px; opacity: 0.6; margin-top: 4px; }
        .error-box { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 77, 77, 0.9); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 100; width: 90%; text-align: center; }
    </style>
</head>
<body>
    <div class="select-container">
        <div class="game-title">Puzzle & Power</div>
        <div class="sub-title">Выберите свой класс</div>

        <div class="class-card" onclick="createCharacter('Warrior')">
            <div class="class-icon">⚔️</div>
            <div><div class="class-title">Воин</div><div class="class-desc">Сила и мощь. Пробивает броню.</div></div>
        </div>

        <div class="class-card" onclick="createCharacter('Mage')">
            <div class="class-icon">🔮</div>
            <div><div class="class-title">Маг</div><div class="class-desc">Интеллект и магия. Бьет по площади.</div></div>
        </div>

        <div class="class-card" onclick="createCharacter('Tank')">
            <div class="class-icon">🛡️</div>
            <div><div class="class-title">Танк</div><div class="class-desc">Выносливость. Держит удар на себе.</div></div>
        </div>

        <div class="class-card" onclick="createCharacter('Archer')">
            <div class="class-icon">🏹</div>
            <div><div class="class-title">Лучник</div><div class="class-desc">Ловкость и крит. Бьет точно в цель.</div></div>
        </div>
    </div>

    <div id="error-box" class="error-box">Ошибка соединения с сервером! Персонаж не создан.</div>

    <script>
        const SERVER_URL = window.SERVER_URL;
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; tg.ready(); tg.expand(); }

        function showError() {
            const box = document.getElementById('error-box');
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        function createCharacter(className) {
            let tgId = 777;
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) tgId = tg.initDataUnsafe.user.id;

            const stats = { str: 15, agl: 12, int: 10, vit: 13, intuition: 5 };

            fetch(`${SERVER_URL}/api/create-character`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tg_id: tgId,
                    name: 'Герой',
                    gender: 'male',
                    class_name: className,
                    stats: stats
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'lobby.html';
                } else {
                    showError();
                }
            })
            .catch(err => {
                console.error("Ошибка сети:", err);
                showError();
            });
        }
    </script>
</body>
</html>
