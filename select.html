<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puzzle & Power — Создание Героя</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #d4e4f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 8px;
    }

    .frame-container {
      max-width: 500px;
      width: 100%;
      background: #f0f7ff;
      border: 6px double #6a9ec4;
      border-radius: 32px 32px 28px 28px;
      padding: 12px 14px 18px;
      box-shadow: 0 20px 40px rgba(0, 40, 80, 0.25), 0 0 0 2px #b8d4e8 inset, 0 0 0 4px #8bb9d9 inset;
      position: relative;
    }

    .creation-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .left-col {
      flex: 1 1 170px;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .avatar-block {
      position: relative;
      background: #e4eff9;
      border-radius: 40px 40px 24px 24px;
      border: 2px solid #7aafd0;
      box-shadow: inset 0 0 20px #c5ddf0, 0 6px 10px #6a9ec444;
      padding: 4px 4px 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
      flex: 1;
    }

    .gender-btn {
      background: transparent;
      border: none;
      font-size: 38px;
      color: #4a8db7;
      cursor: pointer;
      padding: 0 10px;
      line-height: 1;
      text-shadow: 0 0 8px #7aafd066;
      transition: 0.1s ease;
      font-weight: bold;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .gender-btn:active { transform: scale(0.8); }

    .hero-avatar {
      width: 190px;
      height: auto;
      max-height: 250px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px #4a7a9c55);
      transition: 0.2s ease;
      image-rendering: pixelated;
    }

    .class-label {
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      color: #1a4b6d;
      letter-spacing: 3px;
      text-shadow: 0 1px 0 #ffffffaa;
      padding: 2px 0;
      border-bottom: 1px dashed #8bb9d9;
      margin-bottom: 2px;
    }

    .class-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .class-btn {
      background: #e4eff9;
      border: 2px solid #7aafd0;
      border-radius: 30px;
      padding: 10px 4px;
      font-size: 14px;
      font-weight: bold;
      color: #1a4b6d;
      text-shadow: 0 1px 0 #ffffff77;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 2px 4px #6a9ec444;
      font-family: 'Georgia', serif;
      text-align: center;
      line-height: 1.3;
      letter-spacing: 0.5px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .class-btn.selected {
      border-color: #2b7aaa;
      background: #b8ddf5;
      color: #003153;
      box-shadow: 0 0 16px #6a9ec488, inset 0 0 8px #6a9ec466;
    }
    .class-btn:active { transform: scale(0.95); }

    .right-col {
      flex: 2 1 170px;
      min-width: 150px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-card {
      background: #eaf2fc;
      border: 1.5px solid #7aafd0;
      border-radius: 30px;
      padding: 4px 14px 4px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 2px 6px #c5ddf0, 0 2px 4px #6a9ec444;
    }

    .stat-name {
      color: #1a4b6d;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 0 #ffffffaa;
    }

    .stat-value {
      background: #ffffff;
      border: 1px solid #7aafd0;
      border-radius: 30px;
      padding: 0 14px;
      font-size: 16px;
      font-weight: bold;
      color: #005a8c;
      text-shadow: 0 0 8px #6a9ec466;
      min-width: 32px;
      text-align: center;
      box-shadow: inset 0 0 6px #c5ddf0;
    }

    .name-box {
      margin-top: 2px;
      background: #eaf2fc;
      border: 2px solid #7aafd0;
      border-radius: 50px;
      padding: 2px 8px;
      box-shadow: inset 0 0 12px #c5ddf0;
    }

    .name-input {
      width: 100%;
      background: transparent;
      border: none;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #003153;
      font-family: 'Georgia', serif;
      padding: 6px 4px;
      outline: none;
      letter-spacing: 1px;
      text-shadow: 0 1px 0 #ffffffaa;
    }

    .create-btn {
      background: #6a9ec4;
      border: 2px solid #4a8db7;
      border-radius: 50px;
      padding: 9px 8px;
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 2px 0 #2b5a7a;
      cursor: pointer;
      transition: 0.15s ease;
      box-shadow: 0 4px 0 #2b5a7a, 0 6px 16px #4a7a9c66;
      font-family: 'Georgia', serif;
      letter-spacing: 1.5px;
      margin-top: 2px;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .create-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2b5a7a, 0 6px 12px #4a7a9c66;
    }

    @media (max-width: 400px) {
      .frame-container { padding: 8px 8px 12px; }
      .left-col { min-width: 110px; }
      .right-col { min-width: 120px; gap: 4px; }
      .stat-card { padding: 3px 10px 3px 12px; }
      .stat-name { font-size: 11px; }
      .stat-value { font-size: 13px; padding: 0 8px; min-width: 24px; }
      .class-label { font-size: 11px; letter-spacing: 2px; }
      .class-btn { font-size: 11px; padding: 7px 2px; border-radius: 20px; }
      .hero-avatar { width: 140px; max-height: 190px; }
      .avatar-block { min-height: 220px; }
      .gender-btn { font-size: 28px; padding: 0 4px; }
      .name-input { font-size: 12px; padding: 4px 4px; }
      .create-btn { font-size: 13px; padding: 7px 8px; }
    }

    @media (min-width: 401px) and (max-width: 500px) {
      .hero-avatar { width: 160px; max-height: 215px; }
      .avatar-block { min-height: 260px; }
      .class-btn { font-size: 13px; padding: 9px 4px; }
      .stat-name { font-size: 13px; }
    }

    @media (min-width: 501px) {
      .hero-avatar { width: 210px; max-height: 270px; }
      .avatar-block { min-height: 320px; }
      .class-btn { font-size: 15px; padding: 12px 4px; }
      .stat-name { font-size: 15px; }
      .stat-value { font-size: 17px; padding: 0 16px; }
      .class-label { font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="frame-container">
  <div class="creation-grid">
    <div class="left-col">
      <div class="avatar-block">
        <button class="gender-btn" id="prevGenderBtn">◀</button>
        <img id="characterAvatar" class="hero-avatar" src="assets/char_male.png" alt="Герой">
        <button class="gender-btn" id="nextGenderBtn">▶</button>
      </div>

      <div class="class-label">✦ ВЫБОР КЛАССА ✦</div>

      <div class="class-grid">
        <button class="class-btn selected" id="classWarrior" data-class="warrior">⚔️ Воин</button>
        <button class="class-btn" id="classTank" data-class="tank">🛡️ Танк</button>
        <button class="class-btn" id="classElf" data-class="elf">🧝 Эльф</button>
        <button class="class-btn" id="classMage" data-class="mage">🔮 Маг</button>
      </div>
    </div>

    <div class="right-col">
      <div class="stat-card"><span class="stat-name">💪 Сила</span><span class="stat-value" id="statStr">15</span></div>
      <div class="stat-card"><span class="stat-name">🏹 Ловкость</span><span class="stat-value" id="statAgl">12</span></div>
      <div class="stat-card"><span class="stat-name">🧠 Интуиция</span><span class="stat-value" id="statInt">10</span></div>
      <div class="stat-card"><span class="stat-name">❤️ Выносливость</span><span class="stat-value" id="statVit">13</span></div>
      <div class="stat-card"><span class="stat-name">🕯️ Мудрость</span><span class="stat-value" id="statWis">5</span></div>

      <div class="name-box">
        <input type="text" id="heroNameInput" class="name-input" placeholder="ИМЯ ГЕРОЯ" maxlength="14" value="ИМЯ">
      </div>

      <button class="create-btn" id="createHeroBtn">⚡ СОЗДАТЬ</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const STATS_BY_CLASS = {
      warrior: { str: 15, agl: 12, int: 10, vit: 13, wis: 5 },
      tank:    { str: 12, agl: 8,  int: 10, vit: 20, wis: 5 },
      elf:     { str: 10, agl: 18, int: 14, vit: 9,  wis: 4 },
      mage:    { str: 5,  agl: 9,  int: 11, vit: 10, wis: 20 }
    };

    const IMAGES = {
      male: 'assets/char_male.png',
      female: 'assets/char_female.png'
    };

    let currentGender = 'male';
    let currentClass = 'warrior';

    const avatar = document.getElementById('characterAvatar');
    const prevBtn = document.getElementById('prevGenderBtn');
    const nextBtn = document.getElementById('nextGenderBtn');
    const classBtns = document.querySelectorAll('.class-btn');
    const statStr = document.getElementById('statStr');
    const statAgl = document.getElementById('statAgl');
    const statInt = document.getElementById('statInt');
    const statVit = document.getElementById('statVit');
    const statWis = document.getElementById('statWis');
    const nameInput = document.getElementById('heroNameInput');
    const createBtn = document.getElementById('createHeroBtn');

    const SERVER_URL = 'https://shanty-haven-silo.ngrok-free.dev';

    function updateStats(className) {
      const s = STATS_BY_CLASS[className];
      if (!s) return;
      statStr.textContent = s.str;
      statAgl.textContent = s.agl;
      statInt.textContent = s.int;
      statVit.textContent = s.vit;
      statWis.textContent = s.wis;
    }

    function setGender(gender) {
      if (gender !== 'male' && gender !== 'female') return;
      currentGender = gender;
      avatar.src = IMAGES[gender];
      avatar.style.transform = 'scale(0.92)';
      setTimeout(() => { avatar.style.transform = 'scale(1)'; }, 100);
    }

    function switchGender(direction) {
      const genders = ['male', 'female'];
      let idx = genders.indexOf(currentGender);
      idx = (idx + direction + genders.length) % genders.length;
      setGender(genders[idx]);
    }

    function selectClass(className) {
      currentClass = className;
      classBtns.forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.class === className);
      });
      updateStats(className);
    }

    function init() {
      prevBtn.addEventListener('click', (e) => { e.preventDefault(); switchGender(-1); });
      prevBtn.addEventListener('touchstart', (e) => { e.preventDefault(); switchGender(-1); }, { passive: false });
      
      nextBtn.addEventListener('click', (e) => { e.preventDefault(); switchGender(1); });
      nextBtn.addEventListener('touchstart', (e) => { e.preventDefault(); switchGender(1); }, { passive: false });

      classBtns.forEach(btn => {
        const clickHandler = function(e) {
          e.preventDefault();
          const cls = this.dataset.class;
          if (cls) selectClass(cls);
        };
        btn.addEventListener('click', clickHandler);
        btn.addEventListener('touchstart', clickHandler, { passive: false });
      });

      setGender('male');
      selectClass('warrior');
      if (nameInput.value.trim() === '') nameInput.value = 'ИМЯ';

      createBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const name = nameInput.value.trim();
        if (!name || name === 'ИМЯ' || name === 'NAME') {
          alert('Дай имя своему герою!');
          return;
        }

        let tgId = 777;
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
          tgId = window.Telegram.WebApp.initDataUnsafe.user.id;
        }

        const stats = {
          str: parseInt(statStr.textContent, 10),
          agl: parseInt(statAgl.textContent, 10),
          int: parseInt(statInt.textContent, 10),
          vit: parseInt(statVit.textContent, 10),
          wis: parseInt(statWis.textContent, 10)
        };

        const payload = {
          tg_id: tgId,
          name: name,
          gender: currentGender,
          class_name: currentClass,
          stats: stats
        };

        console.log('📦 Отправка в БД:', payload);

        fetch(`${SERVER_URL}/api/create-character`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            alert('✅ Персонаж создан! Добро пожаловать в игру!');
            window.location.href = 'lobby.html';
          } else {
            alert('Ошибка: ' + (data.message || 'Неизвестная ошибка'));
          }
        })
        .catch(err => {
          console.error('Ошибка:', err);
          alert('Не удалось подключиться к серверу!');
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
</body>
</html>
