<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle & Power</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e3f2fd;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .select-container {
            width: 90%;
            max-width: 400px;
            background: linear-gradient(to bottom, #ffffff, #d9ecff);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .game-title {
            font-size: 24px;
            font-weight: 900;
            color: #0d47a1;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sub-title {
            font-size: 14px;
            font-weight: bold;
            color: #1565c0;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .gender-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .arrow-btn {
            font-size: 30px;
            color: #0d47a1;
            cursor: pointer;
            background: none;
            border: none;
            user-select: none;
        }

        .character-preview {
            width: 80px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .character-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .class-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .class-btn {
            background: #42a5f5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.2s;
        }

        .class-btn.active, .class-btn:hover {
            background: #1565c0;
            transform: translateY(-2px);
        }

        .stats-panel {
            margin-bottom: 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .stat-label {
            font-weight: bold;
            color: #1565c0;
        }

        .stat-value {
            background: #1565c0;
            color: #fff;
            width: 40px;
            height: 25px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .create-btn {
            width: 100%;
            background: #ffb300;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
            transition: 0.2s;
        }

        .create-btn:active {
            transform: scale(0.95);
        }

        .error-box {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(211, 47, 47, 0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
            width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="select-container">
        <div class="game-title">Puzzle & Power</div>
        <div class="sub-title">Выбор Класса</div>

        <!-- Переключение пола (пути исправлены на assets/) -->
        <div class="gender-switch">
            <button class="arrow-btn" onclick="changeGender(-1)">◀</button>
            <div class="character-preview">
                <img id="char-img" src="assets/char_male.png" alt="Герой">
            </div>
            <button class="arrow-btn" onclick="changeGender(1)">▶</button>
        </div>

        <!-- Выбор класса -->
        <div class="class-buttons">
            <button class="class-btn active" onclick="selectClass('Warrior')">Воин</button>
            <button class="class-btn" onclick="selectClass('Tank')">Танк</button>
            <button class="class-btn" onclick="selectClass('Mage')">Маг</button>
            <button class="class-btn" onclick="selectClass('Archer')">Лучник</button>
        </div>

        <!-- Статы -->
        <div class="stats-panel">
            <div class="stat-row">
                <div class="stat-label">Сила</div>
                <div class="stat-value">12</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">Ловкость</div>
                <div class="stat-value">10</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">Выносливость</div>
                <div class="stat-value">10</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">Интеллект</div>
                <div class="stat-value">8</div>
            </div>
            <div class="stat-row">
                <div class="stat-label">Интуиция</div>
                <div class="stat-value">8</div>
            </div>
        </div>

        <button class="create-btn" onclick="createCharacter()">Создать</button>
    </div>

    <div id="error-box" class="error-box">Ошибка соединения с сервером! Персонаж не создан.</div>

    <script>
        const SERVER_URL = window.SERVER_URL;
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; tg.ready(); tg.expand(); }

        let selectedGender = 'male';
        let selectedClass = 'Warrior';

        // Пути к картинкам исправлены на assets/
        function changeGender(direction) {
            if (direction === -1) {
                selectedGender = 'female';
                document.getElementById('char-img').src = 'assets/char_female.png';
            } else {
                selectedGender = 'male';
                document.getElementById('char-img').src = 'assets/char_male.png';
            }
        }

        function selectClass(className) {
            selectedClass = className;
            const buttons = document.querySelectorAll('.class-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function showError() {
            const box = document.getElementById('error-box');
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        function createCharacter() {
            let tgId = null;
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgId = tg.initDataUnsafe.user.id;
            } else {
                window.location.href = 'index.html';
                return;
            }

            const stats = { str: 12, agl: 10, vit: 10, int: 8, intuition: 8 };

            fetch(`${SERVER_URL}/api/create-character`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tg_id: tgId,
                    name: 'Герой',
                    gender: selectedGender,
                    class_name: selectedClass,
                    stats: stats
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'lobby.html';
                } else {
                    showError();
                }
            })
            .catch(err => {
                console.error("Ошибка сети:", err);
                showError();
            });
        }
    </script>
</body>
</html>
