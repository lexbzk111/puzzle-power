<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puzzle & Power - Создание Персонажа</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #111;
      font-family: 'Georgia', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 450px;
      background-image: url('assets/bg_creation.png');
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    .left-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 56%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 2;
    }
    .gender-selector {
      width: 100%;
      height: 60%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      position: relative;
    }
    .hero-avatar {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      height: 80%; 
      object-fit: contain;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 3;
    }
    
    /* Красивые фэнтези стрелочки для выбора ПОЛА */
    .arrow-nav {
      background: linear-gradient(135deg, #a17638, #593e1a);
      border: 2px solid #ffcc00;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.3);
      text-shadow: 0 2px 2px #000;
    }
    .arrow-nav:active {
      transform: scale(0.9);
      background: #ffcc00;
      color: #000;
    }

    .stats-container {
      width: 90%;
      height: 32%;
      background: rgba(15, 12, 8, 0.85);
      border: 2px solid #a17638;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      margin-bottom: 5%;
    }
    .stat-box {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #f0e6d2;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 2px;
    }
    .stat-name { font-weight: bold; text-shadow: 0 1px 2px #000; }
    .stat-val { color: #ffcc00; font-weight: bold; text-shadow: 0 1px 2px #000; }

    .right-menu {
      position: absolute;
      top: 0;
      right: 0;
      width: 44%;
      height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 2;
    }
    .title-plate {
      margin-top: 10%;
      height: 8%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffcc00;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px #000;
    }
    
    .class-holder {
      margin-top: 5%;
      height: 51%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0 10px;
    }

    /* КНОПКИ ВЫБОРА КЛАССА С РАМКАМИ И СТИЛЕМ РПГ */
    .class-option {
      height: 22%;
      background: linear-gradient(180deg, #2c1e13, #1a110a);
      border: 2px solid #593e1a;
      border-radius: 8px;
      color: #cdb48d;
      font-weight: bold;
      font-size: 14px;
      font-family: 'Georgia', serif;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 1px 3px rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 2px 3px #000;
    }
    /* Эффект, когда класс выбран (горит золотом) */
    .class-option.selected {
      border-color: #ffcc00;
      background: linear-gradient(180deg, #593e1a, #2c1e13);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 204, 0, 0.4), inset 0 1px 4px rgba(255,255,255,0.2);
    }

    .name-holder {
      margin-top: 8%;
      height: 9%;
      display: flex;
      align-items: center;
      padding: 0 12px;
    }
    .nickname-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #593e1a;
      border-radius: 6px;
      height: 36px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 2px #000;
      outline: none;
    }
    .nickname-input::placeholder { color: rgba(255, 255, 255, 0.3); }

    /* Металлическая крутая кнопка НАЧАТЬ ИГРУ в самом низу */
    .btn-start {
      margin-top: auto;
      margin-bottom: 6%;
      height: 8%;
      background: linear-gradient(180deg, #a12b2b, #591313);
      border: 2px solid #ffcc00;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,255,255,0.3);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-start:active {
      transform: scale(0.97);
      background: linear-gradient(180deg, #591313, #330b0b);
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="left-zone">
    <div class="gender-selector">
      <button class="arrow-nav" onclick="switchGender()">◀</button>
      <img id="character-view" src="assets/char_male.png" class="hero-avatar" alt="Hero">
      <button class="arrow-nav" onclick="switchGender()">▶</button>
    </div>
    <div class="stats-container">
      <div class="stat-box"><span class="stat-name" id="lblStr">Сила</span><span class="stat-val" id="strVal">10</span></div>
      <div class="stat-box"><span class="stat-name" id="lblAgl">Ловкость</span><span class="stat-val" id="aglVal">10</span></div>
      <div class="stat-box"><span class="stat-name" id="lblInt">Интуиция</span><span class="stat-val" id="intVal">10</span></div>
      <div class="stat-box"><span class="stat-name" id="lblVit">Выносливость</span><span class="stat-val" id="vitVal">10</span></div>
      <div class="stat-box"><span class="stat-name" id="lblWis">Мудрость</span><span class="stat-val" id="wisVal">10</span></div>
    </div>
  </div>
  <div class="right-menu">
    <div class="title-plate" id="lblTitlePlate">Создать персонажа</div>
    <div class="class-holder">
      <button class="class-option selected" id="btnClassWarrior" onclick="pickClass(this, 'warrior')">⚔️ Воин</button>
      <button class="class-option" id="idBtnClassTank" onclick="pickClass(this, 'tank')">🛡️ Танк</button>
      <button class="class-option" id="btnClassElf" onclick="pickClass(this, 'elf')">🧝 Эльф</button>
      <button class="class-option" id="btnClassMage" onclick="pickClass(this, 'mage')">🔮 Маг</button>
    </div>
    <div class="name-holder">
      <input type="text" id="hero-name" class="nickname-input" placeholder="Имя героя..." maxlength="12">
    </div>
    <button class="btn-start" id="lblBtnStart" onclick="finishCreation()">Начать игру</button>
  </div>
</div>

<script>
  const translations = {
    ru: {
      titlePlate: "Создать персонажа", btnStart: "Начать игру", placeholderName: "Имя героя...",
      alertName: "Дай имя своему герою!", alertExist: "Персонаж для этого аккаунта уже создан!", alertError: "Ошибка сохранения: ",
      classes: { warrior: "⚔️ Воин", tank: "🛡️ Танк", elf: "🧝 Эльф", mage: "🔮 Маг" },
      stats: { str: "Сила", agl: "Ловкость", int: "Интуиция", vit: "Выносливость", wis: "Мудрость" }
    },
    en: {
      titlePlate: "Create Character", btnStart: "Start Game", placeholderName: "Hero name...",
      alertName: "Give a name to your hero!", alertExist: "Character for this account is already created!", alertError: "Save error: ",
      classes: { warrior: "⚔️ Warrior", tank: "🛡️ Tank", elf: "🧝 Elf", mage: "🔮 Mage" },
      stats: { str: "Strength", agl: "Agility", int: "Intuition", vit: "Vitality", wis: "Wisdom" }
    }
  };
  let currentLang = 'ru';
  const classStats = {
    warrior: { str: 15, agl: 12, int: 10, vit: 13, wis: 5 },
    tank:    { str: 12, agl: 8,  int: 10, vit: 20, wis: 5 },
    elf:     { str: 10, agl: 18, int: 14, vit: 9,  wis: 4 },
    mage:    { str: 5,  agl: 9,  int: 11, vit: 10, wis: 20 }
  };

  let newHero = { gender: 'male', class: 'warrior', name: '' };
  const characterImages = { male: 'assets/char_male.png', female: 'assets/char_female.png' };

  // Используем твою рабочую постоянную ссылку ngrok
  const SERVER_URL = 'https://ngrok-free.dev';

  function applyLanguage(lang) {
    currentLang = lang; const t = translations[lang];
    document.getElementById('lblTitlePlate').innerText = t.titlePlate;
    document.getElementById('lblBtnStart').innerText = t.btnStart;
    document.getElementById('hero-name').placeholder = t.placeholderName;
    document.getElementById('btnClassWarrior').innerText = t.classes.warrior;
    document.getElementById('idBtnClassTank').innerText = t.classes.tank;
    document.getElementById('btnClassElf').innerText = t.classes.elf;
    document.getElementById('btnClassMage').innerText = t.classes.mage;
    document.getElementById('lblStr').innerText = t.stats.str;
    document.getElementById('lblAgl').innerText = t.stats.agl;
    document.getElementById('lblInt').innerText = t.stats.int;
    document.getElementById('lblVit').innerText = t.stats.vit;
    document.getElementById('lblWis').innerText = t.stats.wis;
  }

  function switchGender() {
    const avatar = document.getElementById('character-view');
    avatar.style.opacity = '0'; avatar.style.transform = 'translateX(-50%) scale(0.9)';
    setTimeout(() => {
      newHero.gender = newHero.gender === 'male' ? 'female' : 'male';
      avatar.src = characterImages[newHero.gender];
      avatar.style.opacity = '1'; avatar.style.transform = 'translateX(-50%) scale(1)';
    }, 200);
  }

  function pickClass(btnElement, selectedClass) {
    document.querySelectorAll('.class-option').forEach(el => el.classList.remove('selected'));
    btnElement.classList.add('selected');
    newHero.class = selectedClass;
    
    const stats = classStats[selectedClass];
    document.getElementById('strVal').innerText = stats.str;
    document.getElementById('aglVal').innerText = stats.agl;
    document.getElementById('intVal').innerText = stats.int;
    document.getElementById('vitVal').innerText = stats.vit;
    document.getElementById('wisVal').innerText = stats.wis;
  }

  window.onload = function() {
    let userLang = 'ru';
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
      if (window.Telegram.WebApp.initDataUnsafe.user.language_code?.startsWith('en')) userLang = 'en';
    } else {
      if ((navigator.language || navigator.userLanguage)?.startsWith('en')) userLang = 'en';
    }
    applyLanguage(userLang);
    pickClass(document.querySelector('.class-option'), 'warrior');
  };

  function finishCreation() {
    const t = translations[currentLang];
    const inputName = document.getElementById('hero-name').value.trim();
    if (!inputName) { alert(t.alertName); return; }
    
    newHero.name = inputName;

    const currentStats = {
      str: parseInt(document.getElementById('strVal').innerText),
      agl: parseInt(document.getElementById('aglVal').innerText),
      int: parseInt(document.getElementById('intVal').innerText),
      vit: parseInt(document.getElementById('vitVal').innerText),
      wis: parseInt(document.getElementById('wisVal').innerText)
    };

    let tgId = 777; 
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
      tgId = window.Telegram.WebApp.initDataUnsafe.user.id;
    }

    const payload = {
      tg_id: tgId,
      name: newHero.name,
      gender: newHero.gender,
      class_name: newHero.class, 
      stats: currentStats
    };

    console.log("Отправка пакета в БД:", payload);

    fetch(`${SERVER_URL}/api/create-character`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        window.location.href = 'index.html';
      } else {
        alert(data.code === 'exist' ? t.alertExist : t.alertError + data.message);
      }
    })
    .catch(err => {
      console.error("Ошибка:", err);
      alert("Не удалось подключиться к серверу базы данных. Проверь, работает ли server.py на ПК!");
    });
  }
</script>
</body>
</html>
