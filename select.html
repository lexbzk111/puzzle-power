<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle & Power</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { 
            width: 100%; min-height: 100vh; overflow-y: auto; 
            background: linear-gradient(180deg, #f8fafc 0%, #e0e7ff 100%); /* Светлый, чистый фон */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            color: #334155; /* Темный текст для всего */
        }
        .select-container { width: 92%; max-width: 380px; background: #ffffff; border-radius: 24px; padding: 20px; margin: 15px auto; box-shadow: 0 15px 40px rgba(30, 41, 59, 0.15); text-align: center; }

        /* Заголовок без лишнего */
        .game-title { font-size: 22px; font-weight: 900; color: #1e293b; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }

        .gender-switch { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .gender-label { font-size: 14px; font-weight: 800; color: #94a3b8; cursor: pointer; transition: color 0.2s; }
        .gender-label.active { color: #2563eb; }
        .arrow-btn { font-size: 26px; color: #2563eb; cursor: pointer; background: none; border: none; user-select: none; padding: 0 5px; }
        .character-preview { width: 100px; height: 150px; display: flex; justify-content: center; align-items: center; }
        .character-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Кнопки классов - яркие и сочные */
        .class-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        .class-btn { background: #3b82f6; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); transition: 0.2s; }
        .class-btn.active, .class-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4); }

        /* Поле имени (перенесено выше статов) */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-label { color: #334155; font-weight: 700; font-size: 13px; margin-bottom: 5px; display: block; }
        .hero-name-input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid #cbd5e1; outline: none; font-size: 15px; background: #f8fafc; color: #1e293b; transition: border 0.2s; }
        .hero-name-input:focus { border-color: #3b82f6; }

        /* Статы - темные надписи, аккуратные плашки */
        .stats-panel { margin-bottom: 20px; background: #f8fafc; border-radius: 12px; padding: 12px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .stat-label { font-weight: 700; color: #334155; font-size: 14px; }
        .stat-value { background: #1e293b; color: #fff; width: 38px; height: 24px; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; }

        /* Кнопка создания - акцент */
        .create-btn { width: 100%; background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #1e293b; border: none; border-radius: 12px; padding: 14px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 15px rgba(245, 158, 11, 0.4); text-transform: uppercase; transition: 0.2s; }
        .create-btn:active { transform: scale(0.96); }

        .error-box { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(239, 68, 68, 0.95); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 100; width: 90%; text-align: center; }
    </style>
</head>
<body>

    <div class="select-container">
        <div class="game-title">Создание героя</div>

        <div class="gender-switch">
            <span class="gender-label active" id="label-male" onclick="setGender('male')">МУЖ</span>
            <button class="arrow-btn" onclick="changeGender(-1)">◀</button>
            <div class="character-preview">
                <img id="char-img" src="assets/char_male.png" alt="Герой">
            </div>
            <button class="arrow-btn" onclick="changeGender(1)">▶</button>
            <span class="gender-label" id="label-female" onclick="setGender('female')">ЖЕН</span>
        </div>

        <div class="class-buttons">
            <button class="class-btn active" onclick="selectClass('Warrior')">Воин</button>
            <button class="class-btn" onclick="selectClass('Tank')">Танк</button>
            <button class="class-btn" onclick="selectClass('Mage')">Маг</button>
            <button class="class-btn" onclick="selectClass('Archer')">Лучник</button>
        </div>

        <!-- Поле имени под классами -->
        <div class="input-group">
            <label class="input-label" for="hero-name">Имя героя (4-15 символов):</label>
            <input type="text" id="hero-name" class="hero-name-input" maxlength="15" placeholder="Введите имя...">
        </div>

        <div class="stats-panel">
            <div class="stat-row"><div class="stat-label">Сила</div><div class="stat-value" id="stat-str">8</div></div>
            <div class="stat-row"><div class="stat-label">Ловкость</div><div class="stat-value" id="stat-agl">4</div></div>
            <div class="stat-row"><div class="stat-label">Выносливость</div><div class="stat-value" id="stat-vit">6</div></div>
            <div class="stat-row"><div class="stat-label">Интеллект</div><div class="stat-value" id="stat-int">2</div></div>
            <div class="stat-row"><div class="stat-label">Интуиция</div><div class="stat-value" id="stat-intuition">5</div></div>
        </div>

        <button class="create-btn" onclick="createCharacter()">Создать</button>
    </div>

    <div id="error-box" class="error-box">Ошибка соединения с сервером! Персонаж не создан.</div>

    <script>
        const SERVER_URL = window.SERVER_URL;
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; tg.ready(); tg.expand(); }

        let selectedGender = 'male';
        let selectedClass = 'Warrior';

        const classStats = {
            Warrior: { str: 8, agl: 4, vit: 6, int: 2, intuition: 5 },
            Tank:    { str: 4, agl: 2, vit: 10, int: 2, intuition: 5 },
            Mage:    { str: 2, agl: 4, vit: 6, int: 8, intuition: 5 },
            Archer:  { str: 2, agl: 10, vit: 4, int: 2, intuition: 8 }
        };

        function updateGenderUI() {
            const maleLabel = document.getElementById('label-male');
            const femaleLabel = document.getElementById('label-female');
            if (selectedGender === 'male') { maleLabel.classList.add('active'); femaleLabel.classList.remove('active'); }
            else { femaleLabel.classList.add('active'); maleLabel.classList.remove('active'); }
        }

        function changeGender(direction) {
            if (direction === -1) { selectedGender = 'male'; document.getElementById('char-img').src = 'assets/char_male.png'; }
            else { selectedGender = 'female'; document.getElementById('char-img').src = 'assets/char_female.png'; }
            updateGenderUI();
        }

        function setGender(gender) {
            selectedGender = gender;
            if (gender === 'male') { document.getElementById('char-img').src = 'assets/char_male.png'; }
            else { document.getElementById('char-img').src = 'assets/char_female.png'; }
            updateGenderUI();
        }

        function selectClass(className) {
            selectedClass = className;
            const buttons = document.querySelectorAll('.class-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const stats = classStats[className];
            document.getElementById('stat-str').innerText = stats.str;
            document.getElementById('stat-agl').innerText = stats.agl;
            document.getElementById('stat-vit').innerText = stats.vit;
            document.getElementById('stat-int').innerText = stats.int;
            document.getElementById('stat-intuition').innerText = stats.intuition;
        }

        function showError() {
            const box = document.getElementById('error-box');
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        function createCharacter() {
            let tgId = null;
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) { tgId = tg.initDataUnsafe.user.id; }
            else { window.location.href = 'index.html'; return; }

            const heroName = document.getElementById('hero-name').value.trim();
            if (heroName.length < 4 || heroName.length > 15) {
                alert('Имя героя должно содержать от 4 до 15 символов!');
                return;
            }

            const stats = classStats[selectedClass];

            fetch(`${SERVER_URL}/api/create-character`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tg_id: tgId,
                    name: heroName,
                    gender: selectedGender,
                    class_name: selectedClass,
                    stats: stats
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) { window.location.href = 'lobby.html'; }
                else { showError(); }
            })
            .catch(err => {
                console.error("Ошибка сети:", err);
                showError();
            });
        }
    </script>
</body>
</html>
